<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로아 CP - 캐릭터 시뮬레이터</title>
  <style>
    .statTable { border-collapse: collapse; margin: 8px 0; }
    .statTable th, .statTable td { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
    .statTable th { background: #f5f5f5; font-weight: normal; color: #555; }
    .finalOutput { margin: 6px 0; }
    .innerTabs { margin: 10px 0; }
    .innerTabBtn { margin-right: 4px; }
    .innerTabBtn.active { font-weight: bold; text-decoration: underline; }
    .tabPanel[hidden] { display: none; }
    .fieldGroup { margin: 12px 0; }
    .hoverInfo { cursor: help; border-bottom: 1px dotted #888; }
    .fieldGroup h4 { margin: 4px 0; }
    .surgeBar { border: 1px solid #999; padding: 10px; margin-top: 10px; font-weight: bold; text-align: center; }
    .braceletColumns { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .braceletColumns > div { flex: 1 1 320px; min-width: 280px; }
    .braceletSimBox { border: 1px solid #ccc; padding: 10px; }
    .braceletSimGroup { border: 1px solid #ddd; padding: 8px; margin-bottom: 10px; }
    .braceletSimGroup h5 { margin: 0 0 6px 0; }
    .braceletSimRow { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .braceletSimRow select { flex: 1 1 auto; }
    .braceletSimRow input { width: 80px; }
    .braceletSimGrantRow { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
    .braceletSimGrantRow select { flex: 1 1 220px; }
    .braceletSimTiers { display: flex; gap: 4px; }
    .braceletTierBtn { border: 2px solid transparent; border-radius: 4px; padding: 4px 8px; color: #fff; font-weight: bold; cursor: pointer; text-shadow: 0 1px 1px rgba(0,0,0,0.4); }
    .braceletTierBtn.selected { border-color: #222; }
    .braceletSimRemoveBtn { flex: 0 0 auto; }
    .braceletSimTotal { font-weight: bold; margin-top: 8px; }
    .armorSimRow { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
    .armorSimLabel { width: 70px; flex: 0 0 auto; }
    .armorSimTotal { font-weight: bold; margin-top: 8px; }
    .evolutionNodeGrid { display: flex; flex-wrap: wrap; gap: 10px; }
    .evolutionNode { width: 84px; text-align: center; }
    .evolutionNode img { width: 48px; height: 48px; border: 1px solid #ccc; border-radius: 4px; }
    .evolutionNodeLabel { font-size: 11px; margin-top: 2px; line-height: 1.3; }
    .evolutionTierRow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .evolutionTierLabel { width: 40px; flex: 0 0 auto; font-weight: bold; text-align: center; }
    .evolutionTierNodes { display: flex; gap: 8px; }
    .evolutionCell { width: 76px; text-align: center; }
    .evolutionCell img { width: 44px; height: 44px; border-radius: 50%; }
    .evolutionCell.notInvested .evolutionCellLabel { opacity: 0.55; }
    .evolutionCellLabel { font-size: 10.5px; margin-top: 2px; line-height: 1.25; }
  </style>
</head>
<body>
  <div id="searchScreen">
    <h1>로아 CP</h1>

    <p>딜러 닉네임: <input type="text" id="dealerName" placeholder="딜러 캐릭터명"></p>
    <p>서포터 닉네임: <input type="text" id="supportName" placeholder="서포터 캐릭터명"></p>

    <p>
      <label><input type="radio" name="simMode" value="dealer" checked> 딜러용 시뮬</label>
      <label><input type="radio" name="simMode" value="support"> 서폿용 시뮬</label>
      <label><input type="radio" name="simMode" value="duo"> 딜러&서폿 동시 시뮬</label>
    </p>

    <p>공증 유효율(0~100): <input type="number" id="effectiveRatio" min="0" max="100"></p>
    <p>낙인 유효율(0~100): <input type="number" id="brandEffectiveRatio" min="0" max="100"></p>
    <p>피증1(아덴기) 유효율(0~100): <input type="number" id="effectiveRatio1" min="0" max="100"></p>
    <p>피증2(초각성) 유효율(0~100): <input type="number" id="effectiveRatio2" min="0" max="100"></p>
    <p>시너지 직업 2 (본인 제외): <select id="synergyClass2"></select></p>
    <p>시너지 직업 3 (본인 제외): <select id="synergyClass3"></select></p>

    <button id="searchBtn">조회하기</button>
    <div id="searchMessage"></div>
  </div>

  <div id="dealerView" style="display:none;">
    <button class="backBtn">← 돌아가기</button>
    <h2>딜러용 시뮬</h2>
    <div class="innerTabs">
      <button class="innerTabBtn" data-tab="info">현재 정보</button>
      <button class="innerTabBtn" data-tab="equip">장비</button>
      <button class="innerTabBtn" data-tab="bracelet">팔찌</button>
      <button class="innerTabBtn" data-tab="stone">어빌리티스톤</button>
      <button class="innerTabBtn" data-tab="evolution">아크패시브 진화</button>
      <button class="innerTabBtn" data-tab="gem">보석</button>
      <button class="innerTabBtn" data-tab="synergy">시너지</button>
    </div>
    <div class="tabPanel" data-panel="info"></div>
    <div class="tabPanel" data-panel="equip" hidden>준비 중입니다.</div>
    <div class="tabPanel" data-panel="bracelet" hidden>준비 중입니다.</div>
    <div class="tabPanel" data-panel="stone" hidden>준비 중입니다.</div>
    <div class="tabPanel" data-panel="evolution" hidden>준비 중입니다.</div>
    <div class="tabPanel" data-panel="gem" hidden>준비 중입니다.</div>
    <div class="tabPanel" data-panel="synergy" hidden>준비 중입니다.</div>
  </div>

  <div id="supportView" style="display:none;">
    <button class="backBtn">← 돌아가기</button>
    <h2>서폿용 시뮬</h2>
    <div class="viewBody"></div>
  </div>

  <div id="duoView" style="display:none;">
    <button class="backBtn">← 돌아가기</button>
    <h2>딜러&서폿 동시 시뮬</h2>
    <div class="viewBody"></div>
  </div>

  <script src="/calculate.js"></script>
  <script>
    const searchScreen = document.getElementById('searchScreen');
    const searchBtn = document.getElementById('searchBtn');
    const searchMessage = document.getElementById('searchMessage');
    const dealerNameInput = document.getElementById('dealerName');
    const supportNameInput = document.getElementById('supportName');
    const effectiveRatioInput = document.getElementById('effectiveRatio');
    const brandEffectiveRatioInput = document.getElementById('brandEffectiveRatio');
    const effectiveRatio1Input = document.getElementById('effectiveRatio1');
    const effectiveRatio2Input = document.getElementById('effectiveRatio2');
    const synergyClass2Select = document.getElementById('synergyClass2');
    const synergyClass3Select = document.getElementById('synergyClass3');

    const views = {
      dealer: document.getElementById('dealerView'),
      support: document.getElementById('supportView'),
      duo: document.getElementById('duoView'),
    };

    // 뷰 내부의 안쪽 탭바(현재정보/장비/팔찌/... ) 전환. 탭 버튼을 담은 컨테이너 기준으로 동작.
    function setupInnerTabs(rootEl) {
      const buttons = rootEl.querySelectorAll('.innerTabBtn');
      const panels = rootEl.querySelectorAll('.tabPanel');
      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          buttons.forEach((b) => b.classList.remove('active'));
          panels.forEach((p) => { p.hidden = true; });
          btn.classList.add('active');
          rootEl.querySelector(`.tabPanel[data-panel="${btn.dataset.tab}"]`).hidden = false;
        });
      });
      buttons[0].classList.add('active');
      panels[0].hidden = false;
    }
    setupInnerTabs(views.dealer);

    // calculate.js 내부에서 전역 함수로 참조하는 툴팁 파싱 헬퍼 (calculate.js에는 정의되어 있지 않음)
    function stripHtml(str) {
      if (!str) return '';
      return String(str).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function parseTooltip(tooltipStr) {
      const lines = [];
      try {
        const obj = JSON.parse(tooltipStr);
        Object.values(obj).forEach((el) => {
          if (!el) return;
          if (typeof el.value === 'string') {
            const text = stripHtml(el.value);
            if (text) lines.push(text);
          } else if (el.value && typeof el.value === 'object' && el.value.Element_000 !== undefined) {
            const label = stripHtml(el.value.Element_000);
            const content = stripHtml(el.value.Element_001 || '');
            lines.push(`[${label}] ${content}`);
          }
        });
      } catch (e) {}
      return lines;
    }

    // %로 표시할 숫자를 소수점 2자리로 정리 (부동소수점 오차로 4.0417000000000005% 같은 값이 나오는 것 방지)
    function pct(n) {
      return Number(n || 0).toFixed(2);
    }

    // calculate.js가 반환하는 breakdown 객체(중첩 객체 포함)를 마우스오버 title에 넣을 수 있는
    // 여러 줄 텍스트로 변환. 0/빈 값은 숫자가 아닌 값을 있는 그대로 보여줘야 하는 경우가 아니면 건너뜀.
    function formatBreakdown(obj, indent) {
      indent = indent || '';
      return Object.entries(obj || {})
        .filter(([, v]) => v !== 0 && v !== null && v !== undefined && v !== '')
        .map(([key, value]) => {
          if (typeof value === 'object') {
            const nested = formatBreakdown(value, indent + '  ');
            return nested ? `${indent}${key}:\n${nested}` : '';
          }
          const shown = typeof value === 'number' ? Math.round(value * 10000) / 10000 : value;
          return `${indent}${key}: ${shown}`;
        })
        .filter(Boolean)
        .join('\n');
    }

    // 객체에서 특정 키들을 뺀 새 객체를 반환 (breakdown 중 디버그 전용 항목을 화면 표시에서 빼는 용도)
    function omit(obj, keys) {
      const result = { ...obj };
      keys.forEach((key) => { delete result[key]; });
      return result;
    }

    // title 속성에 안전하게 넣기 위한 큰따옴표/꺾쇠 이스케이프
    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    // breakdown 객체를 받아 바로 title 속성 문자열(따옴표 포함)로 만들어주는 헬퍼
    function hoverTitle(breakdown) {
      return `title="${escapeAttr(formatBreakdown(breakdown))}"`;
    }

    // 시너지 직업 드롭다운을 전체 딜러 직업 목록(calculate.js의 ALL_DEALER_CLASSES)으로 채움
    [synergyClass2Select, synergyClass3Select].forEach((select) => {
      const emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.textContent = '없음';
      select.appendChild(emptyOption);
      ALL_DEALER_CLASSES.forEach((className) => {
        const option = document.createElement('option');
        option.value = className;
        option.textContent = className;
        select.appendChild(option);
      });
    });

    // 닉네임 한쪽만 입력했을 때 반대쪽에 임의로 채워 넣는 기본 캐릭터
    const DEFAULT_DEALER_NAME = '잼구릿';
    const DEFAULT_SUPPORT_NAME = '히유시';

    // 서포터 직업별 기본 유효율(%) 표. 입력칸을 비워두면 서포터 직업에 따라 이 값을 사용.
    const DEFAULT_SUPPORT_RATIO_TABLE = {
      '도화가': { 공증: 95.3, 낙인: 98, 피증1: 84.18, 피증2: 47.42 },
      '바드': { 공증: 94.15, 낙인: 98, 피증1: 71.69, 피증2: 43.06 },
      '홀리나이트': { 공증: 97.5, 낙인: 98, 피증1: 74.13, 피증2: 43.43 },
      '발키리': { 공증: 97.14, 낙인: 98, 피증1: 75.46, 피증2: 42.59 },
    };

    // 유효율 입력값(0~100)을 배율(0~1)로 변환.
    // 값을 직접 입력했으면 그 값을, 비워뒀으면 서포터 직업별 기본표 값을, 표에도 없으면 100%(=1)를 사용.
    function readRatio(inputEl, className, ratioKey) {
      const value = inputEl.value.trim();
      if (value) return parseFloat(value) / 100;
      const classDefault = DEFAULT_SUPPORT_RATIO_TABLE[className]?.[ratioKey];
      return classDefault !== undefined ? classDefault / 100 : 1;
    }

    // 딜러 본인 스탯/배율 표를 <table> HTML로 생성 (딜러용/동시 시뮬 공용)
    function buildDealerStatsHtml(ctx) {
      const { dealerStats, extraDamageResult, critResult, enemyDamageResult, defenseResult, cardExtraDamageResult, classSynergyAttackPercent } = ctx;
      return `
        <table class="statTable">
          <tr><th>무기 공격력</th><td>${dealerStats.weaponAttack.toLocaleString()}</td></tr>
          <tr><th>기본 공격력</th><td>${dealerStats.basePower.toLocaleString()}</td></tr>
          <tr><th>스탯창 공격력</th><td>${dealerStats.statWindowAttack.toLocaleString()}</td></tr>
          <tr><th>치명타 적중률</th><td>${critResult.critRatePercent.toFixed(2)}%</td></tr>
          <tr><th>치명타 피해</th><td>${critResult.critDamagePercent.toFixed(2)}%</td></tr>
          <tr><th>치명타 피해 배율</th><td>${critResult.avgDamageMultiplier.toFixed(4)}</td></tr>
          <tr><th>추가 피해 배율</th><td>${extraDamageResult.qualityTooLow ? '표시 불가 (무기 품질 70% 미만)' : extraDamageResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>적에게 주는 피해 배율</th><td>${enemyDamageResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>방어율 배율</th><td>${defenseResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>카드 추가피해 배율</th><td>${cardExtraDamageResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>시너지(파티 직업) 공격력 증가</th><td>${classSynergyAttackPercent}%</td></tr>
        </table>
      `;
    }

    // 서포터 본인 스탯/배율 표를 <table> HTML로 생성 (서폿용/동시 시뮬 공용)
    function buildSupportStatsHtml(ctx) {
      const { supportStats, allyBuffPercent, buffGemPercent, supportBuffPower, brandResult, adenkiDamageBuffResult, hyperAwakeningDamageBuffResult, cardExtraDamageResult } = ctx;
      return `
        <table class="statTable">
          <tr><th>기본 공격력</th><td>${supportStats.basePower.toLocaleString()}</td></tr>
          <tr><th>아군 공격력 강화 총합</th><td>${allyBuffPercent}%</td></tr>
          <tr><th>공증 버프 보석</th><td>${buffGemPercent}%</td></tr>
          <tr><th>서포터 버프력</th><td>${supportBuffPower.toLocaleString()}</td></tr>
          <tr><th>낙인력 합계</th><td>${brandResult.breakdown.낙인력_합계.toFixed(2)}%</td></tr>
          <tr><th>낙인 배율</th><td>${brandResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>아군 피해량 증가(아덴기) 배율</th><td>${adenkiDamageBuffResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>아군 피해량 증가(초각성) 배율</th><td>${hyperAwakeningDamageBuffResult.multiplier.toFixed(4)}</td></tr>
          <tr><th>서폿카드 받는 피해 증가율</th><td>${cardExtraDamageResult.breakdown.서폿카드_받는피해_증가율}%</td></tr>
        </table>
      `;
    }

    function findEquip(equipmentList, type) {
      return (equipmentList || []).find((it) => it.Type === type) || null;
    }

    function findEquipAll(equipmentList, type) {
      return (equipmentList || []).filter((it) => it.Type === type);
    }

    // 딜러용 시뮬 "현재 정보" 탭 전용 필드(장비 나열/아크그리드/각인/장신구/스펙 정보)를 한 번에 계산
    function buildDealerCurrentInfo(dealerData, dealerStats, extra) {
      const equipment = dealerData.equipment || [];
      const weaponItem = findEquip(equipment, '무기');
      const wanjibItem = findEquip(equipment, '완갑');
      const braceletOptions = getBraceletOptionsFromEquipment(equipment);

      return {
        arkgridCores: getArkgridCoreSummary(dealerData.arkgrid),
        engravingList: getEngravingList(dealerData.engravings),
        // API의 실제 Type 값은 '투구'/'어깨'(모자/견장이 아님) — 실 캐릭터로 확인한 값
        equipList: [['모자', '투구'], ['견장', '어깨'], ['상의', '상의'], ['하의', '하의'], ['장갑', '장갑']].map(([label, apiType]) => ({
          type: label,
          name: findEquip(equipment, apiType)?.Name ? stripHtml(findEquip(equipment, apiType).Name) : '(미장착)',
        })),
        weaponName: weaponItem ? stripHtml(weaponItem.Name) : '(미장착)',
        wanjibName: wanjibItem ? stripHtml(wanjibItem.Name) : '(미장착)',
        braceletOptions,
        braceletEfficiency: calculateBraceletEfficiencyTable(dealerData, extra.supportData, dealerStats, braceletOptions, extra),
        necklace: findEquip(equipment, '목걸이'),
        earrings: findEquipAll(equipment, '귀걸이'),
        rings: findEquipAll(equipment, '반지'),
        abilityStone: findEquip(equipment, '어빌리티 스톤'),
        necklaceExtraDamagePercent: getNecklaceExtraDamagePercent(equipment),
        necklaceEnemyDamagePercent: getNecklaceEnemyDamagePercent(equipment),
        earringAttackPercent: dealerStats.earringAttackPercent,
        earringWeaponAttackPercent: getEarringWeaponAttackPercent(equipment),
        ringCritRatePercent: extra.critResult.critRateBreakdown.반지,
        ringCritDamagePercent: extra.critResult.critDamageBreakdown.반지,
        stoneBaseAttackPercent: getAbilityStoneBaseAttackPercent(equipment),
        stoneEngravingEffects: getAbilityStoneEngravingEffects(equipment),
        itemAvgLevel: dealerData.profiles?.ItemAvgLevel,
        combatPower: dealerData.profiles?.CombatPower,
        evolutionDamagePercent: extra.enemyDamageResult.breakdown.아크패시브_진화형피해,
      };
    }

    function buildArkgridSectionHtml(info) {
      const coreRows = info.arkgridCores.map((c) => `<tr><td>${c.name}</td><td>${c.point}P</td><td>${c.grade}</td></tr>`).join('');
      return `
        <div class="fieldGroup">
          <h4>아크그리드 정보</h4>
          <table class="statTable"><tr><th>코어</th><th>투자 포인트</th><th>등급</th></tr>${coreRows}</table>
        </div>
      `;
    }

    function buildEngravingSectionHtml(info) {
      const rows = info.engravingList.map((e) => `<tr><td>${e.name}</td><td>Lv.${e.level}</td></tr>`).join('');
      return `
        <div class="fieldGroup">
          <h4>유물 각인서 정보</h4>
          <table class="statTable"><tr><th>각인 이름</th><th>레벨</th></tr>${rows}</table>
        </div>
      `;
    }

    function buildEquipmentSectionHtml(info) {
      const armorRows = info.equipList.map((e) => `<tr><th>${e.type}</th><td>${e.name}</td></tr>`).join('');
      return `
        <div class="fieldGroup">
          <h4>장비 정보</h4>
          <table class="statTable">
            ${armorRows}
            <tr><th>무기</th><td>${info.weaponName}</td></tr>
            <tr><th>완갑</th><td>${info.wanjibName}</td></tr>
          </table>
        </div>
      `;
    }

    function buildBraceletSectionHtml(info) {
      const rows = Object.entries(info.braceletOptions)
        .filter(([, value]) => value)
        .map(([key, value]) => `<tr><th>${key}</th><td>${key.endsWith('Percent') ? pct(value) + '%' : value}</td></tr>`)
        .join('');
      return `
        <div class="fieldGroup">
          <h4>팔찌 정보</h4>
          <table class="statTable">${rows || '<tr><td>팔찌 미장착 또는 옵션 없음</td></tr>'}</table>
        </div>
        ${buildBraceletEfficiencySectionHtml(info)}
      `;
    }

    // 팔찌 옵션별 "적에게 주는 피해" 기준 환산 효율표. 값이 0인 옵션(팔찌에 없는 옵션)은 표에서 뺀다.
    function buildBraceletEfficiencySectionHtml(info) {
      const activeRows = info.braceletEfficiency.filter((item) => item.value);
      const rows = activeRows
        .map((item) => `<tr><th>${item.label}</th><td>${item.value}${item.key.endsWith('Percent') ? '%' : ''}</td><td>${pct(item.efficiencyPercent)}%</td><td>${item.method}</td></tr>`)
        .join('');
      const total = activeRows.reduce((sum, item) => sum + item.efficiencyPercent, 0);
      return `
        <div class="fieldGroup">
          <h4>팔찌 효율표 (적에게 주는 피해 기준 환산)</h4>
          <table class="statTable">
            <tr><th>옵션</th><th>값</th><th>환산 효율</th><th>방식</th></tr>
            ${rows || '<tr><td colspan="4">팔찌에 환산 가능한 옵션이 없습니다</td></tr>'}
            ${activeRows.length ? `<tr><th>합산</th><td></td><td>${pct(total)}%</td><td></td></tr>` : ''}
          </table>
        </div>
      `;
    }

    function buildAccessorySectionHtml(info) {
      const earringNames = info.earrings.map((e) => stripHtml(e.Name)).join(', ') || '(미장착)';
      const ringNames = info.rings.map((r) => stripHtml(r.Name)).join(', ') || '(미장착)';
      const stoneEffectsText = info.stoneEngravingEffects.length
        ? info.stoneEngravingEffects.map((e) => `${e.name} Lv.${e.level}`).join(', ')
        : '없음';
      return `
        <div class="fieldGroup">
          <h4>장신구 정보</h4>
          <table class="statTable">
            <tr><th>목걸이</th><td>${info.necklace ? stripHtml(info.necklace.Name) : '(미장착)'} (추가피해 ${pct(info.necklaceExtraDamagePercent)}%, 적주피 ${pct(info.necklaceEnemyDamagePercent)}%)</td></tr>
            <tr><th>귀걸이</th><td>${earringNames} (공격력 ${pct(info.earringAttackPercent)}%, 무기 공격력 ${pct(info.earringWeaponAttackPercent)}%)</td></tr>
            <tr><th>반지</th><td>${ringNames} (치명타 ${pct(info.ringCritRatePercent)}%, 치명타피해 ${pct(info.ringCritDamagePercent)}%)</td></tr>
            <tr><th>어빌리티 스톤</th><td>${info.abilityStone ? stripHtml(info.abilityStone.Name) : '(미장착)'} (기본공격력 ${pct(info.stoneBaseAttackPercent)}%, 각인 효과: ${stoneEffectsText})</td></tr>
          </table>
        </div>
      `;
    }

    function buildSpecSectionHtml(info, ctx) {
      return `
        <div class="fieldGroup">
          <h4>캐릭터 스펙 정보</h4>
          <table class="statTable">
            <tr><th>아이템 레벨</th><td>${info.itemAvgLevel ?? '-'}</td></tr>
            <tr><th>전투력</th><td>${info.combatPower ?? '-'}</td></tr>
            <tr><th>무기 공격력</th><td class="hoverInfo" ${hoverTitle(ctx.dealerStats.weaponAttackBreakdown)}>${ctx.dealerStats.weaponAttack.toLocaleString()}</td></tr>
            <tr><th>추가 피해</th><td class="hoverInfo" ${hoverTitle(ctx.extraDamageResult.extraDamageBreakdown)}>${ctx.extraDamageResult.qualityTooLow ? '표시 불가' : ctx.extraDamageResult.multiplier.toFixed(4)}</td></tr>
            <tr><th>적에게 주는 피해</th><td class="hoverInfo" ${hoverTitle(omit(ctx.enemyDamageResult.breakdown, ['뭉툭한가시_디버그']))}>${ctx.enemyDamageResult.multiplier.toFixed(4)}</td></tr>
            <tr><th>진화형 피해</th><td class="hoverInfo" ${hoverTitle(ctx.enemyDamageResult.breakdown.아크패시브_진화형피해_상세)}>${pct(info.evolutionDamagePercent)}%</td></tr>
            <tr><th>치명타 적중률</th><td class="hoverInfo" ${hoverTitle(ctx.critResult.critRateBreakdown)}>${ctx.critResult.critRatePercent.toFixed(2)}%</td></tr>
            <tr><th>치명타 피해</th><td class="hoverInfo" ${hoverTitle(ctx.critResult.critDamageBreakdown)}>${ctx.critResult.critDamagePercent.toFixed(2)}%</td></tr>
          </table>
        </div>
      `;
    }

    // 아드/암수 체크박스 상태에 따라 최종 공격력/방어율 배율/최종 산출식/풀버프 최종 산출식을
    // 다시 계산해서 "현재 정보" 탭의 실시간 표시만 갱신한다. (baseline·최종 딜 상승량에는 영향 없음)
    function recomputeDealerLiveNumbers(ctx) {
      const adrenalineUse = document.getElementById('adrenalineUseCheckbox').checked;
      const darkGrenadeUse = document.getElementById('darkGrenadeCheckbox').checked;

      const adrenalineBonus = ctx.adrenalineBonusBase + (adrenalineUse ? 30 : 0);
      const finalDamage = calculateFinalDamage(
        ctx.dealerStats.basePower, ctx.dealerStats.accessoryAttackFlat, ctx.dealerStats.chaosCoreAttack.flat,
        ctx.supportBuffPower, ctx.dealerStats.chaosCoreAttack.percent, ctx.dealerStats.earringAttackPercent,
        ctx.dealerStats.arkgridGemsAttackPercent, adrenalineBonus, ctx.classSynergyAttackPercent,
        ctx.arkPassiveAttackPercent
      );
      const defenseResult = calculateDefenseMultiplier({
        synergyAPercent: ctx.classSynergyDefenseReductionPercent,
        darkGrenadeActive: darkGrenadeUse,
      });
      const finalOutputResult = calculateFinalOutput(
        finalDamage, ctx.critResult.avgDamageMultiplier, ctx.extraDamageResult.multiplier, ctx.enemyDamageResult.multiplier,
        defenseResult.multiplier, ctx.brandResult.multiplier, ctx.cardExtraDamageResult.multiplier
      );
      const fullBuffFinalOutputResult = calculateFullBuffFinalOutput(
        finalOutputResult.output, ctx.adenkiDamageBuffResult.multiplier, ctx.hyperAwakeningDamageBuffResult.multiplier
      );

      document.getElementById('liveFinalDamage').textContent = finalDamage.toLocaleString();
      document.getElementById('liveDefenseMultiplier').textContent = defenseResult.multiplier.toFixed(4);
      document.getElementById('liveFinalOutput').textContent = finalOutputResult.output.toLocaleString();
      document.getElementById('liveFullBuffOutput').textContent = fullBuffFinalOutputResult.output.toLocaleString();
    }

    function renderDealerInfoTab(ctx, info) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="info"]');

      // 최종 딜 상승량은 항상 체크박스 OFF 상태로 고정 계산한 풀버프 최종 산출식을 기준으로 비교한다.
      // Phase 1에서는 편집 가능한 탭이 없어 baseline과 현재값이 같으므로 항상 0.00%.
      const surgePercent = ((ctx.fullBuffFinalOutputResult.output - ctx.baselineFullBuffOutput) / ctx.baselineFullBuffOutput) * 100;

      const buildEngravingName = getClassBuildEngravingName(ctx.dealerData.arkpassive);

      panel.innerHTML = `
        <div class="fieldGroup">
          <h4>${ctx.dealerLabel} (${ctx.dealerStats.className})</h4>
          <p>직업각인 명: ${buildEngravingName || '(확인 불가)'}</p>
        </div>
        ${buildArkgridSectionHtml(info)}
        <div class="fieldGroup">
          <h4>아크그리드 젬 정보</h4>
          <table class="statTable">
            <tr><th>공격력</th><td>${pct(ctx.dealerStats.arkgridGemsAttackPercent)}%</td></tr>
            <tr><th>추가피해</th><td>${pct(ctx.extraDamageResult.extraDamageBreakdown.아크그리드젬)}%</td></tr>
            <tr><th>보스피해</th><td>${pct(ctx.enemyDamageResult.breakdown.아크그리드젬_보스피해)}%</td></tr>
          </table>
        </div>
        ${buildEngravingSectionHtml(info)}
        ${buildEquipmentSectionHtml(info)}
        ${buildBraceletSectionHtml(info)}
        ${buildAccessorySectionHtml(info)}
        ${buildSpecSectionHtml(info, ctx)}
        <div class="fieldGroup">
          <h4>아크패시브 진화+깨달음 (조건부·시간제한 노드도 일단 포함, 클래스별 예외는 추후 정리 예정)</h4>
          <table class="statTable">
            <tr><th>공격력</th><td>${pct(ctx.arkPassiveAttackPercent)}%</td></tr>
            <tr><th>적에게 주는 피해</th><td>${pct(ctx.enemyDamageResult.breakdown.아크패시브_상시버프_적주피)}%</td></tr>
            <tr><th>추가 피해</th><td>${pct(ctx.extraDamageResult.extraDamageBreakdown.아크패시브_상시버프)}%</td></tr>
          </table>
        </div>
        <div class="fieldGroup">
          <h4>최종 공격력: <span id="liveFinalDamage">${ctx.finalDamage.toLocaleString()}</span></h4>
          <p>방어율 배율: <span id="liveDefenseMultiplier">${ctx.defenseResult.multiplier.toFixed(4)}</span></p>
          <p>최종 산출식: <span id="liveFinalOutput">${ctx.finalOutputResult.output.toLocaleString()}</span></p>
          <p>풀버프 최종 산출식: <span id="liveFullBuffOutput">${ctx.fullBuffFinalOutputResult.output.toLocaleString()}</span></p>
        </div>
        <div class="fieldGroup">
          <label><input type="checkbox" id="adrenalineUseCheckbox"> 아드 사용 (공격력 +30%)</label>
          <label style="margin-left:12px;"><input type="checkbox" id="darkGrenadeCheckbox"> 암수 사용 (암흑 수류탄 방어력감소 20%)</label>
        </div>
        <div class="surgeBar">최종 딜 상승량: <span id="surgeBarValue">${surgePercent.toFixed(2)}</span>%</div>
      `;

      document.getElementById('adrenalineUseCheckbox').addEventListener('change', () => recomputeDealerLiveNumbers(ctx));
      document.getElementById('darkGrenadeCheckbox').addEventListener('change', () => recomputeDealerLiveNumbers(ctx));
    }

    // 팔찌 시뮬레이터 상태: 기본 옵션 최대 2개(힘/민첩/지능/특화/신속/치명 중, 자유 입력),
    // 부여 옵션 최대 3개(BRACELET_OPTION_CATALOG에서 옵션 종류 + 3단계 등급 선택)
    const BRACELET_SIM_MAX = { basic: 2, grant: 3 };
    const braceletSimState = { basic: [{ type: '', value: '' }], grant: [{ catalogKey: '', tierIndex: null }] };
    let braceletSimCtx = null;

    function renderBraceletSimRows(group) {
      if (group === 'grant') { renderBraceletSimGrantRows(); return; }
      renderBraceletSimBasicRows();
    }

    // "팔찌 기본 옵션" 행: 힘/민첩/지능/특화/신속/치명 드롭다운 + 자유 숫자 입력 (기존과 동일).
    // 같은 그룹 내 다른 행이 이미 고른 스탯은 드롭다운에서 빼서 중복 선택을 막는다.
    function renderBraceletSimBasicRows() {
      const container = document.querySelector('.braceletSimRows[data-group="basic"]');
      container.innerHTML = '';
      braceletSimState.basic.forEach((row, index) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'braceletSimRow';

        const select = document.createElement('select');
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '옵션 선택';
        select.appendChild(emptyOption);
        const othersPicked = braceletSimState.basic.filter((_, i) => i !== index).map((r) => r.type).filter(Boolean);
        BRACELET_BASIC_OPTION_TYPES.filter((t) => !othersPicked.includes(t)).forEach((t) => {
          const optionEl = document.createElement('option');
          optionEl.value = t;
          optionEl.textContent = t;
          if (t === row.type) optionEl.selected = true;
          select.appendChild(optionEl);
        });
        select.addEventListener('change', () => {
          row.type = select.value;
          renderBraceletSimBasicRows();
          recomputeBraceletSimulator();
        });

        const input = document.createElement('input');
        input.type = 'number';
        input.placeholder = '값';
        input.value = row.value;
        input.addEventListener('input', () => {
          row.value = parseFloat(input.value) || 0;
          recomputeBraceletSimulator();
        });

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          braceletSimState.basic.splice(index, 1);
          if (braceletSimState.basic.length === 0) braceletSimState.basic.push({ type: '', value: '' });
          renderBraceletSimBasicRows();
          recomputeBraceletSimulator();
        });

        rowEl.appendChild(select);
        rowEl.appendChild(input);
        rowEl.appendChild(removeBtn);
        container.appendChild(rowEl);
      });

      const addBtn = document.querySelector('.braceletSimAddBtn[data-group="basic"]');
      addBtn.style.display = braceletSimState.basic.length >= BRACELET_SIM_MAX.basic ? 'none' : '';
    }

    // 카탈로그를 딜러/공용/서폿 그룹(optgroup)으로 나눠서 <option> 마크업 생성. excludeKeys는
    // 같은 그룹 내 다른 행이 이미 고른 옵션 종류(중복 선택 방지용).
    function braceletSimCatalogOptionsHtml(excludeKeys) {
      const categories = [
        { key: 'dealer', label: '딜러 옵션' },
        { key: 'both', label: '무기공격력(공용)' },
        { key: 'support', label: '서폿 옵션' },
      ];
      return categories.map((cat) => {
        const items = BRACELET_OPTION_CATALOG.filter((c) => c.category === cat.key && !excludeKeys.includes(c.key));
        if (!items.length) return '';
        const options = items.map((c) => `<option value="${c.key}">${c.label}</option>`).join('');
        return `<optgroup label="${cat.label}">${options}</optgroup>`;
      }).join('');
    }

    // "팔찌 부여 옵션" 행: 실제 옵션 종류(카탈로그) 드롭다운 + 3단계 등급 색상 버튼(하늘색/보라색/주황색).
    // 종류를 고르면 그 옵션의 대표 수치(첫 효과 기준)가 버튼에 표시되고, 등급을 누르면 딸린 효과가
    // (1~2개) 전부 같이 세팅된다.
    function renderBraceletSimGrantRows() {
      const container = document.querySelector('.braceletSimRows[data-group="grant"]');
      container.innerHTML = '';
      braceletSimState.grant.forEach((row, index) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'braceletSimGrantRow';

        const select = document.createElement('select');
        const othersPicked = braceletSimState.grant.filter((_, i) => i !== index).map((r) => r.catalogKey).filter(Boolean);
        select.innerHTML = `<option value="">옵션 선택</option>${braceletSimCatalogOptionsHtml(othersPicked)}`;
        select.value = row.catalogKey || '';
        select.addEventListener('change', () => {
          row.catalogKey = select.value;
          row.tierIndex = null;
          renderBraceletSimGrantRows();
          recomputeBraceletSimulator();
        });

        const tierContainer = document.createElement('div');
        tierContainer.className = 'braceletSimTiers';
        const catalogEntry = BRACELET_OPTION_CATALOG.find((c) => c.key === row.catalogKey);
        if (catalogEntry) {
          const primaryEffect = catalogEntry.effects[0];
          BRACELET_TIER_COLORS.forEach((color, tierIdx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'braceletTierBtn' + (row.tierIndex === tierIdx ? ' selected' : '');
            btn.style.background = color;
            btn.title = BRACELET_TIER_LABELS[tierIdx];
            btn.textContent = `${primaryEffect.tiers[tierIdx]}${primaryEffect.unit}`;
            btn.addEventListener('click', () => {
              row.tierIndex = tierIdx;
              renderBraceletSimGrantRows();
              recomputeBraceletSimulator();
            });
            tierContainer.appendChild(btn);
          });
        }

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'braceletSimRemoveBtn';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          braceletSimState.grant.splice(index, 1);
          if (braceletSimState.grant.length === 0) braceletSimState.grant.push({ catalogKey: '', tierIndex: null });
          renderBraceletSimGrantRows();
          recomputeBraceletSimulator();
        });

        rowEl.appendChild(select);
        rowEl.appendChild(tierContainer);
        rowEl.appendChild(removeBtn);
        container.appendChild(rowEl);
      });

      const addBtn = document.querySelector('.braceletSimAddBtn[data-group="grant"]');
      addBtn.style.display = braceletSimState.grant.length >= BRACELET_SIM_MAX.grant ? 'none' : '';
    }

    // "최종 정보" 탭의 최종 딜 상승량은 baseline(체크박스 OFF, 실제 기어)과 비교하는 값인데, 팔찌/장비/
    // 어빌리티스톤 시뮬레이터에서 가상 조합을 고르면 그 값 대신 시뮬레이터들의 totalChangePercent를
    // 보여준다(defenseMultiplier/brandMultiplier/cardMultiplier/버프 배율들은 딜러 자신의 장비 교체로는
    // 안 바뀌는 상수라 before/after 비율 계산에서 그대로 약분되므로, 각 시뮬레이터가 독립적으로 구한
    // totalChangePercent가 풀버프 최종 산출식 기준 변화율과 수학적으로 동일하다). 세 시뮬레이터가
    // 동시에 활성화될 수 있으므로 각자의 값을 따로 기억해뒀다가 곱연산으로 합쳐서 표시한다.
    const surgeBarSimContributions = { bracelet: 0, armor: 0, abilityStone: 0 };
    function updateSurgeBar() {
      const combined = (toMultiplier(surgeBarSimContributions.bracelet) * toMultiplier(surgeBarSimContributions.armor) * toMultiplier(surgeBarSimContributions.abilityStone) - 1) * 100;
      const surgeEl = document.getElementById('surgeBarValue');
      if (surgeEl) surgeEl.textContent = pct(combined);
    }
    function updateSurgeBarFromBracelet(totalChangePercent) {
      surgeBarSimContributions.bracelet = totalChangePercent;
      updateSurgeBar();
    }
    function updateSurgeBarFromArmor(totalChangePercent) {
      surgeBarSimContributions.armor = totalChangePercent;
      updateSurgeBar();
    }
    function updateSurgeBarFromAbilityStone(totalChangePercent) {
      surgeBarSimContributions.abilityStone = totalChangePercent;
      updateSurgeBar();
    }

    function recomputeBraceletSimulator() {
      const resultEl = document.querySelector('.braceletSimResult');
      const selections = {
        basic: braceletSimState.basic.filter((r) => r.type && r.value).map((r) => ({ type: r.type, value: r.value })),
        grant: braceletSimState.grant.filter((r) => r.catalogKey && r.tierIndex != null).map((r) => ({ catalogKey: r.catalogKey, tierIndex: r.tierIndex })),
      };
      if (!selections.basic.length && !selections.grant.length) {
        resultEl.innerHTML = '<p>옵션을 선택하면 결과가 표시됩니다.</p>';
        updateSurgeBarFromBracelet(0);
        return;
      }
      const result = calculateHypotheticalBraceletEfficiency(braceletSimCtx.dealerData, braceletSimCtx.supportData, braceletSimCtx, selections);
      const rows = result.rows
        .filter((item) => item.value)
        .map((item) => {
          const displayValue = typeof item.value === 'string' ? item.value : `${item.value}${item.key.endsWith('Percent') ? '%' : ''}`;
          return `<tr><th>${item.label}</th><td>${displayValue}</td><td>${pct(item.efficiencyPercent)}%</td></tr>`;
        })
        .join('');
      resultEl.innerHTML = `
        <table class="statTable"><tr><th>옵션</th><th>값</th><th>환산 효율</th></tr>${rows}</table>
        <p class="braceletSimTotal">실제 팔찌 대비 변화: ${pct(result.totalChangePercent)}%</p>
      `;
      updateSurgeBarFromBracelet(result.totalChangePercent);
    }

    function setupBraceletSimulator(ctx) {
      braceletSimCtx = ctx;
      braceletSimState.basic = [{ type: '', value: '' }];
      braceletSimState.grant = [{ catalogKey: '', tierIndex: null }];
      renderBraceletSimRows('basic');
      renderBraceletSimRows('grant');
      recomputeBraceletSimulator();

      document.querySelectorAll('.braceletSimAddBtn').forEach((btn) => {
        btn.onclick = () => {
          const group = btn.dataset.group;
          if (braceletSimState[group].length < BRACELET_SIM_MAX[group]) {
            braceletSimState[group].push(group === 'basic' ? { type: '', value: '' } : { catalogKey: '', tierIndex: null });
            renderBraceletSimRows(group);
            recomputeBraceletSimulator();
          }
        };
      });
    }

    // "팔찌" 탭: 왼쪽에 실제 착용 팔찌 기준 효율표, 오른쪽에 가상 옵션 조합을 시험해보는 시뮬레이터.
    function renderDealerBraceletTab(ctx, info) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="bracelet"]');
      panel.innerHTML = `
        <div class="braceletColumns">
          <div>${buildBraceletSectionHtml(info)}</div>
          <div class="braceletSimBox">
            <h4>팔찌 시뮬레이터 (가상 조합)</h4>
            <div class="braceletSimGroup">
              <h5>팔찌 기본 옵션 (최대 2개)</h5>
              <div class="braceletSimRows" data-group="basic"></div>
              <button type="button" class="braceletSimAddBtn" data-group="basic">+ 옵션 추가</button>
            </div>
            <div class="braceletSimGroup">
              <h5>팔찌 부여 옵션 (최대 3개)</h5>
              <div class="braceletSimRows" data-group="grant"></div>
              <button type="button" class="braceletSimAddBtn" data-group="grant">+ 옵션 추가</button>
            </div>
            <div class="braceletSimResult"></div>
          </div>
        </div>
      `;
      setupBraceletSimulator(ctx);
    }

    // 방어구 5종 실제 착용 정보(부위/아이템명/레벨/힘·민첩·지능 기여치 + 합계) 표
    function buildArmorInfoSectionHtml(ctx) {
      const breakdown = getArmorBreakdown(ctx.dealerData.equipment);
      const rows = breakdown
        .map((b) => `<tr><th>${ARMOR_TYPE_LABELS[b.type]}</th><td>${b.item ? stripHtml(b.item.Name) : '(미장착)'}</td><td>Lv.${b.level}</td><td>${b.statFlat.toLocaleString()}</td></tr>`)
        .join('');
      const total = breakdown.reduce((sum, b) => sum + b.statFlat, 0);
      return `
        <div class="fieldGroup">
          <h4>장비 정보 (방어구 5종)</h4>
          <table class="statTable">
            <tr><th>부위</th><th>아이템</th><th>레벨</th><th>힘/민첩/지능</th></tr>
            ${rows}
            <tr><th>합계</th><td></td><td></td><td>${total.toLocaleString()}</td></tr>
          </table>
        </div>
      `;
    }

    // 장비 시뮬레이터 상태: 방어구 5종 각각 가상 레벨(10~25, 0이면 실제 착용 유지)
    const armorSimState = {};
    let armorSimCtx = null;

    function renderArmorSimRows() {
      const container = document.querySelector('.armorSimRows');
      container.innerHTML = '';
      ARMOR_EQUIPMENT_TYPES.forEach((apiType) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'armorSimRow';

        const labelEl = document.createElement('span');
        labelEl.className = 'armorSimLabel';
        labelEl.textContent = ARMOR_TYPE_LABELS[apiType];

        const select = document.createElement('select');
        const keepOption = document.createElement('option');
        keepOption.value = '';
        keepOption.textContent = '실제 착용 유지';
        select.appendChild(keepOption);
        for (let lv = 10; lv <= 25; lv++) {
          const optionEl = document.createElement('option');
          optionEl.value = lv;
          optionEl.textContent = `Lv.${lv}`;
          if (armorSimState[apiType] === lv) optionEl.selected = true;
          select.appendChild(optionEl);
        }
        select.addEventListener('change', () => {
          armorSimState[apiType] = select.value ? parseInt(select.value, 10) : 0;
          recomputeArmorSimulator();
        });

        rowEl.appendChild(labelEl);
        rowEl.appendChild(select);
        container.appendChild(rowEl);
      });
    }

    function recomputeArmorSimulator() {
      const resultEl = document.querySelector('.armorSimResult');
      const hasSelection = ARMOR_EQUIPMENT_TYPES.some((t) => armorSimState[t]);
      if (!hasSelection) {
        resultEl.innerHTML = '<p>레벨을 선택하면 결과가 표시됩니다.</p>';
        updateSurgeBarFromArmor(0);
        return;
      }
      const result = calculateHypotheticalArmorEfficiency(armorSimCtx.dealerData, armorSimCtx.dealerStats, armorSimCtx, armorSimState);
      const rows = result.rows.map((item) => `<tr><th>${item.label}</th><td>${item.value}</td><td>${pct(item.efficiencyPercent)}%</td></tr>`).join('');
      resultEl.innerHTML = `
        <table class="statTable"><tr><th>부위</th><th>레벨</th><th>환산 효율</th></tr>${rows}</table>
        <p class="armorSimTotal">실제 장비 대비 변화: ${pct(result.totalChangePercent)}%</p>
      `;
      updateSurgeBarFromArmor(result.totalChangePercent);
    }

    function setupArmorSimulator(ctx) {
      armorSimCtx = ctx;
      ARMOR_EQUIPMENT_TYPES.forEach((t) => { armorSimState[t] = 0; });
      renderArmorSimRows();
      recomputeArmorSimulator();
    }

    // "장비" 탭: 왼쪽에 실제 착용 방어구 기준 정보, 오른쪽에 가상 레벨을 시험해보는 시뮬레이터.
    function renderDealerEquipTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="equip"]');
      panel.innerHTML = `
        <div class="braceletColumns">
          <div>${buildArmorInfoSectionHtml(ctx)}</div>
          <div class="braceletSimBox">
            <h4>장비 시뮬레이터 (가상 레벨)</h4>
            <div class="armorSimRows"></div>
            <div class="armorSimResult"></div>
          </div>
        </div>
      `;
      setupArmorSimulator(ctx);
    }

    // 실제 착용 중인 어빌리티 스톤 정보(각인 효과 2개 + 레벨 보너스 + 각인별 환산 기여도) 표
    function buildAbilityStoneInfoSectionHtml(ctx) {
      const equipment = ctx.dealerData.equipment;
      const stone = equipment.find((it) => it.Type === '어빌리티 스톤');
      const effects = getAbilityStoneEngravingEffects(equipment);
      const effectRows = effects.map((e) => `<tr><th>${e.name}</th><td>Lv.${e.level}</td></tr>`).join('');
      const otherBonus = getAbilityStoneOtherEngravingBonus(ctx.dealerData.engravings);
      const adrenalineBonus = getAdrenalineStoneBonus(equipment);
      const sharpWeaponBonus = getSharpWeaponStoneBonus(ctx.dealerData.engravings);
      return `
        <div class="fieldGroup">
          <h4>어빌리티 스톤 정보</h4>
          <table class="statTable">
            <tr><th>아이템</th><td>${stone ? stripHtml(stone.Name) : '(미장착)'}</td></tr>
            ${effectRows || '<tr><td colspan="2">각인 효과 없음</td></tr>'}
            <tr><th>레벨 보너스(기본 공격력)</th><td>${pct(getAbilityStoneBaseAttackPercent(equipment))}%</td></tr>
            <tr><th>레벨 보너스(치명타 피해)</th><td>${pct(getAbilityStoneCritDamagePercent(equipment))}%</td></tr>
            <tr><th>환산: 적주피%(동일 각인에 합산)</th><td>${pct(otherBonus.enemyDamagePercent)}%</td></tr>
            <tr><th>환산: 치명타 적중률%</th><td>${pct(otherBonus.critRatePercent)}%</td></tr>
            <tr><th>환산: 공격력%(아드레날린)</th><td>${pct(adrenalineBonus)}%</td></tr>
            <tr><th>환산: 치명타 피해%(예리한 둔기)</th><td>${pct(sharpWeaponBonus)}%</td></tr>
          </table>
        </div>
        ${buildAbilityStoneEfficiencySectionHtml(ctx)}
      `;
    }

    // 현재 착용 중인 어빌리티 스톤의 각인 효과별 환산 효율 + 총 환산 효율("스톤이 아예 없었다면"과 비교) —
    // 팔찌/장비 효율표와 같은 성격.
    function buildAbilityStoneEfficiencySectionHtml(ctx) {
      const result = calculateCurrentAbilityStoneEfficiency(ctx.dealerData, ctx.dealerStats, ctx);
      const rows = result.rows
        .map((item) => `<tr><th>${item.label}</th><td>${item.value}</td><td>${pct(item.efficiencyPercent)}%</td></tr>`)
        .join('');
      return `
        <div class="fieldGroup">
          <h4>어빌리티 스톤 효율표 (스톤 없음 대비 환산)</h4>
          <table class="statTable">
            <tr><th>각인</th><th>레벨</th><th>환산 효율</th></tr>
            ${rows || '<tr><td colspan="3">각인 효과 없음</td></tr>'}
            <tr><th>합산</th><td></td><td>${pct(result.totalEfficiencyPercent)}%</td></tr>
          </table>
        </div>
      `;
    }

    // "9/7 어빌리티 스톤 최적화" — 현재 착용 중인 5개 각인 중 Lv.3+Lv.2 조합 전수 탐색 결과
    function buildAbilityStone97OptimizationHtml(ctx) {
      const opt = calculateAbilityStone97Optimization(ctx.dealerData, ctx.dealerStats, ctx);
      if (!opt) return '<p>착용 중인 각인이 부족해서 계산할 수 없습니다.</p>';
      return `
        <table class="statTable">
          <tr><th>Lv.3 각인</th><td>${opt.lv3}</td></tr>
          <tr><th>Lv.2 각인</th><td>${opt.lv2}</td></tr>
          <tr><th>실제 스톤 대비 변화</th><td>${pct(opt.changePercent)}%</td></tr>
        </table>
      `;
    }

    // 어빌리티 스톤 시뮬레이터 상태: 최대 2슬롯(실제 스톤과 동일), 각각 각인명 + 레벨(1~4)
    const abilityStoneSimState = [{ name: '', level: 0 }, { name: '', level: 0 }];
    let abilityStoneSimCtx = null;

    function renderAbilityStoneSimRows() {
      const container = document.querySelector('.abilityStoneSimRows');
      container.innerHTML = '';
      abilityStoneSimState.forEach((row, index) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'braceletSimGrantRow';

        const select = document.createElement('select');
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '각인 선택';
        select.appendChild(emptyOption);
        const othersPicked = abilityStoneSimState.filter((_, i) => i !== index).map((r) => r.name).filter(Boolean);
        Object.keys(ABILITY_STONE_FULL_CATALOG).filter((name) => !othersPicked.includes(name)).forEach((name) => {
          const optionEl = document.createElement('option');
          optionEl.value = name;
          optionEl.textContent = name;
          if (name === row.name) optionEl.selected = true;
          select.appendChild(optionEl);
        });
        select.addEventListener('change', () => {
          row.name = select.value;
          renderAbilityStoneSimRows();
          recomputeAbilityStoneSimulator();
        });

        const levelSelect = document.createElement('select');
        const emptyLevelOption = document.createElement('option');
        emptyLevelOption.value = '';
        emptyLevelOption.textContent = '레벨';
        levelSelect.appendChild(emptyLevelOption);
        for (let lv = 1; lv <= 4; lv++) {
          const optionEl = document.createElement('option');
          optionEl.value = lv;
          optionEl.textContent = `Lv.${lv}`;
          if (row.level === lv) optionEl.selected = true;
          levelSelect.appendChild(optionEl);
        }
        levelSelect.addEventListener('change', () => {
          row.level = levelSelect.value ? parseInt(levelSelect.value, 10) : 0;
          recomputeAbilityStoneSimulator();
        });

        rowEl.appendChild(select);
        rowEl.appendChild(levelSelect);
        container.appendChild(rowEl);
      });
    }

    function recomputeAbilityStoneSimulator() {
      const resultEl = document.querySelector('.abilityStoneSimResult');
      const selections = abilityStoneSimState.filter((r) => r.name && r.level).map((r) => ({ name: r.name, level: r.level }));
      if (!selections.length) {
        resultEl.innerHTML = '<p>각인과 레벨을 선택하면 결과가 표시됩니다.</p>';
        updateSurgeBarFromAbilityStone(0);
        return;
      }
      const result = calculateHypotheticalAbilityStoneEfficiency(abilityStoneSimCtx.dealerData, abilityStoneSimCtx.dealerStats, abilityStoneSimCtx, selections);
      const rows = result.rows.map((item) => `<tr><th>${item.label}</th><td>${item.value}</td><td>${pct(item.efficiencyPercent)}%</td></tr>`).join('');
      resultEl.innerHTML = `
        <table class="statTable"><tr><th>각인</th><th>레벨</th><th>환산 효율</th></tr>${rows}</table>
        <p class="braceletSimTotal">실제 스톤 대비 변화: ${pct(result.totalChangePercent)}%</p>
      `;
      updateSurgeBarFromAbilityStone(result.totalChangePercent);
    }

    function setupAbilityStoneSimulator(ctx) {
      abilityStoneSimCtx = ctx;
      abilityStoneSimState[0] = { name: '', level: 0 };
      abilityStoneSimState[1] = { name: '', level: 0 };
      renderAbilityStoneSimRows();
      recomputeAbilityStoneSimulator();
    }

    // "어빌리티스톤" 탭: 왼쪽에 실제 착용 스톤 정보 + 9/7 최적화, 오른쪽에 가상 각인 조합 시뮬레이터.
    function renderDealerAbilityStoneTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="stone"]');
      panel.innerHTML = `
        <div class="braceletColumns">
          <div>
            ${buildAbilityStoneInfoSectionHtml(ctx)}
            <div class="fieldGroup">
              <h4>9/7 어빌리티 스톤 최적화</h4>
              ${buildAbilityStone97OptimizationHtml(ctx)}
            </div>
          </div>
          <div class="braceletSimBox">
            <h4>어빌리티 스톤 시뮬레이터 (가상 조합)</h4>
            <div class="abilityStoneSimRows"></div>
            <div class="abilityStoneSimResult"></div>
          </div>
        </div>
      `;
      setupAbilityStoneSimulator(ctx);
    }

    // 아크패시브 진화 탭: 전체 트리(5티어×6칸, 모든 직업 공통)를 그리고, 찍은 칸은 실제 아이콘, 안 찍힌
    // 칸은 (알려진 경우) 실제 아이콘을 흐리게, 모르는 경우만 회색 placeholder로 표시 (읽기 전용)
    function renderDealerEvolutionTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="evolution"]');
      const fullTree = getArkPassiveEvolutionFullTree(ctx.dealerData.arkpassive);

      const rowsHtml = fullTree.map((row, i) => `
        <div class="evolutionTierRow">
          <div class="evolutionTierLabel">${i + 1}티어</div>
          <div class="evolutionTierNodes">
            ${row.map((cell) => cell.invested ? `
              <div class="evolutionCell" title="${cell.description}">
                <img src="${cell.icon}" alt="${cell.name}">
                <div class="evolutionCellLabel">${cell.name}${cell.level ? ' Lv.' + cell.level : ''}</div>
              </div>
            ` : `
              <div class="evolutionCell notInvested" title="${cell.name} (미투자)">
                <img src="${cell.icon}" alt="${cell.name}">
                <div class="evolutionCellLabel">${cell.name}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      panel.innerHTML = `
        <div class="fieldGroup">
          <h4>아크패시브 진화 - 전체 트리</h4>
          ${rowsHtml}
        </div>
      `;
    }

    function renderDealerView(ctx) {
      const info = buildDealerCurrentInfo(ctx.dealerData, ctx.dealerStats, ctx);
      renderDealerInfoTab(ctx, info);
      renderDealerEquipTab(ctx);
      renderDealerBraceletTab(ctx, info);
      renderDealerAbilityStoneTab(ctx);
      renderDealerEvolutionTab(ctx);
    }

    function renderSupportView(ctx) {
      views.support.querySelector('.viewBody').innerHTML = `
        <h3>${ctx.supportLabel} (${ctx.supportStats.className})</h3>
        ${buildSupportStatsHtml(ctx)}
      `;
    }

    function renderDuoView(ctx) {
      views.duo.querySelector('.viewBody').innerHTML = `
        <h3>딜러: ${ctx.dealerLabel} (${ctx.dealerStats.className})</h3>
        ${buildDealerStatsHtml(ctx)}
        <h3>서포터: ${ctx.supportLabel} (${ctx.supportStats.className})</h3>
        ${buildSupportStatsHtml(ctx)}
        <h3 class="finalOutput">최종 공격력: ${ctx.finalDamage.toLocaleString()}</h3>
        <h3 class="finalOutput">최종 산출식: ${ctx.finalOutputResult.output.toLocaleString()}</h3>
        <h3 class="finalOutput">풀버프 최종 산출식: ${ctx.fullBuffFinalOutputResult.output.toLocaleString()}</h3>
      `;
    }

    const renderers = { dealer: renderDealerView, support: renderSupportView, duo: renderDuoView };

    function showView(mode) {
      searchScreen.style.display = 'none';
      Object.values(views).forEach((view) => { view.style.display = 'none'; });
      views[mode].style.display = '';
    }

    function backToSearch() {
      Object.values(views).forEach((view) => { view.style.display = 'none'; });
      searchScreen.style.display = '';
    }

    document.querySelectorAll('.backBtn').forEach((btn) => {
      btn.addEventListener('click', backToSearch);
    });

    searchBtn.addEventListener('click', async () => {
      const dealerNameRaw = dealerNameInput.value.trim();
      const supportNameRaw = supportNameInput.value.trim();

      if (!dealerNameRaw && !supportNameRaw) {
        searchMessage.textContent = '한개 이상의 닉네임을 입력하세요';
        return;
      }

      const dealerIsDefault = !dealerNameRaw;
      const supportIsDefault = !supportNameRaw;
      const dealerName = dealerNameRaw || DEFAULT_DEALER_NAME;
      const supportName = supportNameRaw || DEFAULT_SUPPORT_NAME;
      const simMode = document.querySelector('input[name="simMode"]:checked').value;

      searchMessage.textContent = '조회 중...';

      try {
        const response = await fetch(`/api/character?dealer=${encodeURIComponent(dealerName)}&support=${encodeURIComponent(supportName)}`);
        const data = await response.json();

        if (!response.ok) {
          searchMessage.textContent = data.error || '조회에 실패했습니다.';
          return;
        }

        searchMessage.textContent = '';

        const dealerStats = calculateCharacterStats(data.dealer);
        const supportStats = calculateCharacterStats(data.support);

        if (!dealerStats || !supportStats) {
          searchMessage.textContent = '무기 정보를 찾을 수 없습니다.';
          return;
        }

        const dealerLabel = dealerIsDefault ? '' : dealerStats.characterName;
        const supportLabel = supportIsDefault ? '' : supportStats.characterName;

        const partyClassNames = [synergyClass2Select.value, synergyClass3Select.value].filter(Boolean);
        const fullPartyClassNames = [dealerStats.className, ...partyClassNames];

        const effectiveRatio = readRatio(effectiveRatioInput, supportStats.className, '공증');
        const brandEffectiveRatio = readRatio(brandEffectiveRatioInput, supportStats.className, '낙인');
        const effectiveRatio1 = readRatio(effectiveRatio1Input, supportStats.className, '피증1');
        const effectiveRatio2 = readRatio(effectiveRatio2Input, supportStats.className, '피증2');

        const allyBuffPercent = getTotalAllyAttackBuffPercent(data.support.equipment, supportStats.braceletOptions, data.support.arkgrid);
        const buffGemPercent = getSupportBuffGemPercent(data.support.gems, supportStats.className);
        const supportBuffPower = calculateSupportBuffPower(supportStats.basePower, allyBuffPercent, buffGemPercent, effectiveRatio);

        const adrenalineStoneBonus = getAdrenalineStoneBonus(data.dealer.equipment);
        const adrenalineBonusBase = (hasAdrenalineEngraving(data.dealer.engravings) ? 9 : 0) + adrenalineStoneBonus;
        const classSynergyAttackPercent = sumPartySynergyPercent(fullPartyClassNames, SYNERGY_ATTACK_POWER_CLASSES, SYNERGY_ATTACK_POWER_PERCENT);
        const arkPassiveAttackPercent = getArkPassivePersistentAttackPercent(data.dealer.arkpassive);

        const finalDamage = calculateFinalDamage(
          dealerStats.basePower, dealerStats.accessoryAttackFlat, dealerStats.chaosCoreAttack.flat, supportBuffPower,
          dealerStats.chaosCoreAttack.percent, dealerStats.earringAttackPercent, dealerStats.arkgridGemsAttackPercent,
          adrenalineBonusBase, classSynergyAttackPercent, arkPassiveAttackPercent
        );

        const critResult = calculateCritMultiplier(data.dealer, data.support, { partyClassNames });
        const extraDamageResult = calculateExtraDamageMultiplier(data.dealer);
        const enemyDamageResult = calculateEnemyDamageMultiplier(data.dealer, critResult.critRatePercent, data.support, brandEffectiveRatio, { partyClassNames });
        const brandResult = calculateBrandMultiplier(data.support, { brandEffectiveRatio });
        const adenkiDamageBuffResult = calculateSupportAdenkiDamageBuffMultiplier(data.support, supportStats.className, { effectiveRatio1 });
        const hyperAwakeningDamageBuffResult = calculateSupportHyperAwakeningDamageBuffMultiplier(data.support, supportStats.className, { effectiveRatio2 });
        const cardExtraDamageResult = calculateCardExtraDamageMultiplier();
        const classSynergyDefenseReductionPercent = sumPartySynergyPercent(fullPartyClassNames, SYNERGY_DEFENSE_REDUCTION_CLASSES, SYNERGY_DEFENSE_REDUCTION_PERCENT);
        const defenseResult = calculateDefenseMultiplier({ synergyAPercent: classSynergyDefenseReductionPercent });

        const finalOutputResult = calculateFinalOutput(
          finalDamage, critResult.avgDamageMultiplier, extraDamageResult.multiplier, enemyDamageResult.multiplier,
          defenseResult.multiplier, brandResult.multiplier, cardExtraDamageResult.multiplier
        );
        const fullBuffFinalOutputResult = calculateFullBuffFinalOutput(
          finalOutputResult.output, adenkiDamageBuffResult.multiplier, hyperAwakeningDamageBuffResult.multiplier
        );

        const ctx = {
          dealerData: data.dealer, supportData: data.support,
          dealerStats, supportStats, dealerLabel, supportLabel,
          partyClassNames, brandEffectiveRatio,
          allyBuffPercent, buffGemPercent, supportBuffPower,
          adrenalineBonusBase, classSynergyAttackPercent, classSynergyDefenseReductionPercent, arkPassiveAttackPercent,
          finalDamage, critResult, extraDamageResult, enemyDamageResult, brandResult,
          adenkiDamageBuffResult, hyperAwakeningDamageBuffResult, cardExtraDamageResult,
          defenseResult, finalOutputResult, fullBuffFinalOutputResult,
          baselineFullBuffOutput: fullBuffFinalOutputResult.output,
        };

        renderers[simMode](ctx);
        showView(simMode);
      } catch (error) {
        searchMessage.textContent = '오류가 발생했습니다: ' + error.message;
      }
    });
  </script>
</body>
</html>
