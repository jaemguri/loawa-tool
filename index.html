<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로아 듀오 시뮬레이터 - 캐릭터 정보 조회</title>
</head>
<body>
  <h1>내 캐릭터 정보 조회</h1>
  <p>여기에 캐릭터 정보가 표시될 예정입니다.</p>

  <input type="text" id="charName" placeholder="캐릭터명을 입력하세요">
  <button id="searchBtn">조회하기</button>

  <div id="result"></div>

  <script src="calculate.js"></script>
  <script>
    const searchBtn = document.getElementById('searchBtn');
    const charNameInput = document.getElementById('charName');
    const resultDiv = document.getElementById('result');

    // 태그(<FONT>, <BR> 등) 걷어내고 순수 텍스트만 남기는 함수
    function stripHtml(str) {
      if (!str) return '';
      return String(str).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // 게임 툴팁(JSON 문자열)을 읽기 쉬운 줄바꿈 텍스트로 바꿔주는 함수
    function parseTooltip(tooltipStr) {
      const lines = [];
      try {
        const obj = JSON.parse(tooltipStr);
        Object.values(obj).forEach((el) => {
          if (!el) return;
          if (typeof el.value === 'string') {
            const text = stripHtml(el.value);
            if (text) lines.push(text);
          } else if (el.value && typeof el.value === 'object' && el.value.Element_000 !== undefined) {
            const label = stripHtml(el.value.Element_000);
            const content = stripHtml(el.value.Element_001 || '');
            lines.push(`[${label}] ${content}`);
          }
        });
      } catch (e) {
        // 파싱 실패하면 그냥 빈 배열 반환
      }
      return lines;
    }

    searchBtn.addEventListener('click', async () => {
      const name = charNameInput.value.trim();
      if (!name) {
        resultDiv.textContent = '캐릭터명을 입력해주세요.';
        return;
      }

      resultDiv.textContent = '조회 중...';

      try {
        const response = await fetch(`/api/character?name=${encodeURIComponent(name)}`);
        const data = await response.json();

        if (!response.ok) {
          resultDiv.textContent = data.error || '조회에 실패했습니다.';
          return;
        }

        let html = '';

        // ① 기본 스탯
        html += `<h2>${data.profiles.CharacterName} (${data.profiles.ServerName})</h2>`;
        html += `<p>클래스: ${data.profiles.CharacterClassName} / 아이템레벨: ${data.profiles.ItemAvgLevel}</p>`;
        html += `<pre>${JSON.stringify(data.profiles.Stats, null, 2)}</pre>`;

        // ② 장비 (무기, 악세서리 등)
        html += `<h3>장비</h3>`;
        (data.equipment || []).forEach((item) => {
          html += `<p><b>${item.Type} - ${stripHtml(item.Name)}</b></p>`;
          html += `<pre>${parseTooltip(item.Tooltip).join('\n')}</pre>`;
        });

        // ③ 아크그리드
        html += `<h3>아크그리드</h3>`;
        if (data.arkgrid && data.arkgrid.Slots) {
          data.arkgrid.Slots.forEach((slot) => {
            html += `<p><b>${slot.Name} (Point: ${slot.Point})</b></p>`;
            html += `<pre>${parseTooltip(slot.Tooltip).join('\n')}</pre>`;
            (slot.Gems || []).forEach((gem) => {
              html += `<pre>[젬-${gem.Grade}] ${parseTooltip(gem.Tooltip).join(' / ')}</pre>`;
            });
          });
        }

        // --- 무기 공격력 계산 테스트 ---
        const weaponItem = (data.equipment || []).find((item) => item.Type === '무기');
        let weaponTestHtml = '';
        if (weaponItem) {
          const levelMatch = stripHtml(weaponItem.Name).match(/\+(\d+)/);
          const weaponLevel = levelMatch ? parseInt(levelMatch[1], 10) : 0;

          const braceletItem = (data.equipment || []).find((it) => it.Type === '팔찌');
          const braceletText = braceletItem ? parseTooltip(braceletItem.Tooltip).join(' ') : '';
          const braceletOptions = parseBraceletOptions(braceletText);
          const braceletFlat = braceletOptions.weaponAttackFlat;
          

          const earringItems = (data.equipment || []).filter((it) => it.Type === '귀걸이');
          let earringPercent = 0;
          earringItems.forEach((it) => {
            const text = parseTooltip(it.Tooltip).join(' ');
            earringPercent += extractPercent(text, '무기 공격력');
          });

          let coreFlat = 0;
          let corePercent = 0;
          let debugCoreRaw = '';
          let debugCoreActivated = '';
          if (data.arkgrid && data.arkgrid.Slots) {
            const chaosStarSlot = data.arkgrid.Slots.find((s) => s.Name.includes('혼돈의 별 코어'));
            if (chaosStarSlot) {
              const strippedCoreOption = getCoreOptionText(chaosStarSlot.Tooltip);
              const segments = getActivatedCoreSegments(strippedCoreOption, chaosStarSlot.Point);
              const coreSums = sumCoreSegments(segments, '무기 공격력');
              coreFlat = coreSums.flat;
              corePercent = coreSums.percent;
              debugCoreRaw = strippedCoreOption;
              debugCoreActivated = segments.join(' | ');
            }
          }

          const enlightenmentLevel = getArkPassiveLevelFromData(data.arkpassive, '깨달음');
          const enlightenmentPercent = enlightenmentWeaponAttackPercent(enlightenmentLevel);

          const flatBonusSum = braceletFlat + coreFlat;
          const percentBonusSum = earringPercent + corePercent + enlightenmentPercent;

          const calculated = calculateWeaponAttack(weaponLevel, flatBonusSum, percentBonusSum);
          const primaryStat = getMaxPrimaryStat(data.profiles.Stats);
          const purePower = calculatePureAttackPower(primaryStat, calculated);
          const gemPercent = getGemsBaseAttackPercent(data.gems);
          const stonePercent = getAbilityStoneBaseAttackPercent(data.equipment);
          const basePower = calculateBaseAttackPower(purePower, gemPercent, stonePercent);

          weaponTestHtml = `
            <h3>무기 공격력 계산</h3>
            <p>무기 레벨: ${weaponLevel}</p>
            <p>팔찌 고정값: ${braceletFlat}</p>
            <p>코어 고정값: ${coreFlat}</p>
            <p>귀걸이 %: ${earringPercent}</p>
            <p>코어 %: ${corePercent}</p>
            <p>코어 원본: ${debugCoreRaw}</p>
            <p>코어 활성화: ${debugCoreActivated}</p>
            <p>깨달음 레벨: ${enlightenmentLevel} → 무기 공격력 %: ${enlightenmentPercent}</p>
            <p><b>최종 계산값: ${calculated.toLocaleString()}</b></p>
            <p>힘/민첩/지능(최댓값): ${primaryStat}</p>
            <p><b>순수 공격력: ${purePower.toLocaleString()}</b></p>
            <p>보석 기본공격력 %: ${gemPercent}</p>
            <p>세공 기본공격력 %: ${stonePercent}</p>
            <p><b>기본 공격력: ${basePower.toLocaleString()}</b></p>
          `;
        }

        resultDiv.innerHTML = weaponTestHtml + html;
      } catch (error) {
        resultDiv.textContent = '오류가 발생했습니다: ' + error.message;
      }
    });
  </script>
</body>
</html>
