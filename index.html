            }).join('')}
          </div>
        </div>
      `).join('');
    }

    // 커스텀 진화 시뮬레이터: 실제 트리와 같은 5x6 배치를 그대로 쓰되, 각 칸을 레벨 선택 드롭다운으로 대체.
    // evolutionSimState[티어][열] = 선택된 레벨(0 = 미투자). 아이콘 이미지는 안 쓰고 이름/레벨만 표시
    // (읽기 전용 트리와 시각적으로 구분되도록).
    let evolutionSimCtx = null;
    const evolutionSimState = EVOLUTION_TREE_LAYOUT.map((row) => row.map(() => 0));

    // 티어 전체 합계 제약(EVOLUTION_TIER_MAX_TOTAL) 위반 없이 이 칸이 가질 수 있는 최대 레벨 — 노드 자체의
    // 최대 레벨과, "이 칸 빼고 같은 티어에서 이미 쓴 합계를 뺀 나머지 티어 예산" 중 더 작은 쪽.
    function getEvolutionCellMaxLevel(tierIdx, colIdx, name) {
      const individualMax = EVOLUTION_NODE_MAX_LEVEL[name] || 1;
      const tierBudget = EVOLUTION_TIER_MAX_TOTAL[tierIdx];
      const othersSum = evolutionSimState[tierIdx].reduce((sum, v, i) => (i === colIdx ? sum : sum + v), 0);
      return Math.max(0, Math.min(individualMax, tierBudget - othersSum));
    }

    function renderEvolutionCustomGrid() {
      const container = document.querySelector('.evolutionCustomGrid');
      const rowsHtml = EVOLUTION_TREE_LAYOUT.map((row, tierIdx) => {
        const tierUsed = evolutionSimState[tierIdx].reduce((a, b) => a + b, 0);
        return `
        <div class="evolutionTierRow">
          <div class="evolutionTierLabel">${tierIdx + 1}티어<br><span style="font-weight:normal;font-size:10.5px;">(${tierUsed}/${EVOLUTION_TIER_MAX_TOTAL[tierIdx]})</span></div>
          <div class="evolutionTierNodes">
            ${row.map((name, colIdx) => {
              const maxLevel = getEvolutionCellMaxLevel(tierIdx, colIdx, name);
              const current = evolutionSimState[tierIdx][colIdx];
              const options = [];
              for (let lv = 0; lv <= maxLevel; lv++) {
                options.push(`<option value="${lv}" ${lv === current ? 'selected' : ''}>${lv === 0 ? '-' : 'Lv.' + lv}</option>`);
              }
              return `
                <div class="evolutionCustomCell">
                  <div class="evolutionCellLabel">${name}</div>
                  <select data-tier="${tierIdx}" data-col="${colIdx}">${options.join('')}</select>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      }).join('');
      container.innerHTML = rowsHtml;
      container.querySelectorAll('select').forEach((sel) => {
        sel.addEventListener('change', () => {
          const tierIdx = parseInt(sel.dataset.tier, 10);
          const colIdx = parseInt(sel.dataset.col, 10);
          const name = EVOLUTION_TREE_LAYOUT[tierIdx][colIdx];
          const desired = parseInt(sel.value, 10);
          const maxAllowed = getEvolutionCellMaxLevel(tierIdx, colIdx, name);
          evolutionSimState[tierIdx][colIdx] = Math.min(desired, maxAllowed);
          renderEvolutionCustomGrid();
          recomputeEvolutionSimulator();
        });
      });
    }

    function recomputeEvolutionSimulator() {
      const resultEl = document.querySelector('.evolutionSimResult');
      const selections = [];
      EVOLUTION_TREE_LAYOUT.forEach((row, tierIdx) => {
        row.forEach((name, colIdx) => {
          const level = evolutionSimState[tierIdx][colIdx];
          if (level > 0) selections.push({ name, level });
        });
      });
      if (!selections.length) {
        resultEl.innerHTML = '<p>노드를 선택하면 결과가 표시됩니다.</p>';
        return;
      }
      const result = calculateHypotheticalEvolutionEfficiency(evolutionSimCtx.dealerData, evolutionSimCtx.supportData, evolutionSimCtx, selections);
      const rows = result.rows.map((item) => `<tr><th>${item.label}</th><td>${item.value}</td><td>${pct(item.efficiencyPercent)}%</td></tr>`).join('');
      resultEl.innerHTML = `
        <table class="statTable"><tr><th>노드</th><th>레벨</th><th>환산 효율</th></tr>${rows}</table>
        <table class="statTable">
          <tr><th>미투자 대비 커스텀 선택</th><td>${pct(result.totalChangePercent)}%</td></tr>
          <tr><th>미투자 대비 현재 실제 트리</th><td>${pct(result.realChangePercent)}%</td></tr>
          <tr><th>현재 실제 트리 대비 커스텀 선택</th><td>${pct(result.vsRealPercent)}%</td></tr>
        </table>
        <p style="font-size:11px;color:#888;">※ 1티어 스탯(치명 제외)/4티어 분쇄·선각자·진군·기원/5티어 전체는 아직 계산식이 없어 선택해도 0%로 반영됩니다(추후 추가 예정).</p>
      `;
    }

    function setupEvolutionSimulator(ctx) {
      evolutionSimCtx = ctx;
      EVOLUTION_TREE_LAYOUT.forEach((row, tierIdx) => { row.forEach((_, colIdx) => { evolutionSimState[tierIdx][colIdx] = 0; }); });
      renderEvolutionCustomGrid();
      recomputeEvolutionSimulator();
    }

    // 진화 노드 선택 배열([{name,level}])을 "이름 Lv.N, 이름 Lv.N" 형태 문자열로
    function formatEvolutionSelections(sels) {
      if (!sels || sels.length === 0) return '(미투자)';
      return sels.map((s) => `${s.name} Lv.${s.level}`).join(', ');
    }

    // "진화 트리 최적화 추천(1~5티어)" — 9/7 어빌리티 스톤 최적화와 같은 성격의 읽기 전용 결과(드롭다운 없이
    // 바로 계산). 사용자가 정리한 티어별 판단 규칙(calculateEvolutionTreeOptimization 참고)을 그대로 따름.
    // 5티어는 뭉툭한 가시/입식 타격가(항상 비교)와 마나 용광로(찍혀있을 때만 비교)만 대상 — 음속 돌파는
    // 실제 공식에 이동속도·공격속도 데이터가 아직 없어 제외. 5티어 실투자에 Lv.1이 섞여있으면(현재
    // 지원하는 실측 텍스트가 Lv.2뿐이라) 5티어는 건드리지 않고 실제값을 그대로 유지한다(tier.unsupported).
    // skillShares(선택): 전투분석 지분 — 넘기면 뭉툭한 가시처럼 크리티컬 적중률에 좌우되는 후보 비교에
    // 스킬 트라이포드의 치명타 적중률 보너스가 실제로 반영된다(한가한신수 캐릭터 실측: 지분 가중치 없이는
    // 입식 타격가가 근소 우위였는데, 지분 가중하면 뭉툭한 가시가 +6.87% 우위로 뒤집힘).
    function buildEvolutionTreeOptimizationHtml(ctx, skillShares) {
      const result = calculateEvolutionTreeOptimization(ctx.dealerData, ctx.supportData, ctx, skillShares);
      const tierRow = (label, tier) => `
        <tr>
          <th>${label}</th>
          <td>${formatEvolutionSelections(tier.current)}</td>
          <td>${tier.unsupported ? '(Lv.1 포함 — 미지원)' : (tier.changed ? '→ ' + formatEvolutionSelections(tier.recommended) : '(변경 없음)')}</td>
        </tr>
      `;
      return `
        <table class="statTable">
          <tr><th>티어</th><th>현재</th><th>추천</th></tr>
          ${tierRow('1티어', result.tier1)}
          ${tierRow('2티어', result.tier2)}
          ${tierRow('3티어', result.tier3)}
          ${tierRow('4티어', result.tier4)}
          ${tierRow('5티어', result.tier5)}
          <tr><th>총 변화율</th><td colspan="2">${pct(result.totalChangePercent)}%</td></tr>
        </table>
        <p style="font-size:11px;color:#888;">5티어는 뭉툭한 가시/입식 타격가(항상 비교)·마나 용광로(찍혀있을 때만 비교)만 대상입니다. 음속 돌파는 이동속도·공격속도 데이터가 아직 없어 제외됩니다.${skillShares && skillShares.length ? ' 전투분석 지분이 반영된 결과입니다.' : ' 전투분석 사진을 등록하면 스킬 지분이 반영됩니다(뭉툭한 가시 판단에 특히 중요).'}</p>
      `;
    }

    // 전투분석 탭에서 재계산할 때마다 이 진화 최적화 결과도 같이 갱신하기 위한 진입점(현재 정보 탭의
    // recomputeDealerLiveNumbers와 동일한 "실시간 갱신" 패턴).
    function renderEvolutionOptimizationSection(ctx, skillShares) {
      const el = document.getElementById('evolutionOptimizationSection');
      if (!el) return;
      el.innerHTML = buildEvolutionTreeOptimizationHtml(ctx, skillShares);
    }

    function renderDealerEvolutionTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="evolution"]');
      const fullTree = getArkPassiveEvolutionFullTree(ctx.dealerData.arkpassive);

      panel.innerHTML = `
        <div class="braceletColumns">
          <div class="fieldGroup">
            <h4>아크패시브 진화 - 전체 트리</h4>
            ${buildEvolutionTreeHtml(fullTree)}
            <h4>진화 트리 최적화 추천 (1~5티어)</h4>
            <div id="evolutionOptimizationSection">${buildEvolutionTreeOptimizationHtml(ctx, [])}</div>
          </div>
          <div>
            <h4>커스텀 진화 시뮬레이터</h4>
            <div class="evolutionCustomGrid"></div>
            <div class="evolutionSimResult"></div>
          </div>
        </div>
      `;
      setupEvolutionSimulator(ctx);
    }

    // 이미지 소스(HTMLImageElement 또는 캔버스)의 한 영역을 지정 크기로 축소한 그레이스케일 픽셀 배열로
    // 변환 — 아이콘 교차 검증(사진에서 잘라낸 아이콘 영역 vs 실제 API 아이콘)에 공통으로 사용.
    const ICON_COMPARE_SIZE = 16;
    function regionToGrayscalePixels(source, sx, sy, sw, sh, size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx2d = canvas.getContext('2d');
      ctx2d.drawImage(source, sx, sy, sw, sh, 0, 0, size, size);
      const imageData = ctx2d.getImageData(0, 0, size, size).data;
      const gray = new Array(size * size);
      for (let i = 0; i < size * size; i++) {
        gray[i] = 0.299 * imageData[i * 4] + 0.587 * imageData[i * 4 + 1] + 0.114 * imageData[i * 4 + 2];
      }
      return gray;
    }

    // CORS 허용된 이미지 로드(cdn-lostark.game.onstove.com은 Access-Control-Allow-Origin: * 를 보내서
    // crossOrigin='anonymous'로 캔버스에 그린 뒤 픽셀을 읽어도 캔버스가 오염되지 않음 — 실제 CDN 응답
    // 헤더로 사전 확인함).
    function loadImageCors(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = 'anonymous';
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    // 전처리된 캔버스에서 [y0, y1) 구간만 잘라내 단일 줄(PSM SINGLE_LINE로 이미 설정된 worker)로 인식한
    // 텍스트를 반환 — 행 단위 격리 재인식(아래 두 함수)에서 공통으로 씀.
    async function ocrSingleLineCrop(worker, canvas, y0, y1) {
      const yy0 = Math.max(0, Math.floor(y0));
      const yy1 = Math.min(canvas.height, Math.ceil(y1));
      const h = yy1 - yy0;
      if (h <= 0) return '';
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = canvas.width;
      cropCanvas.height = h;
      cropCanvas.getContext('2d').drawImage(canvas, 0, yy0, cropCanvas.width, h, 0, 0, cropCanvas.width, h);
      const { data } = await worker.recognize(cropCanvas, {}, { blocks: true });
      return flattenTesseractLines(data.blocks).map((l) => l.text).join(' ').trim();
    }

    // 이름 매칭에 실패한(빨간 테두리) 행을, 그 행 영역만 따로 잘라내서 단일 줄(PSM SINGLE_LINE)로 다시
    // 인식을 시도한다. 전체 이미지를 한 번에 읽는 자동 레이아웃 분석은 가끔 특정 행 하나만 옆 줄과 섞이거나
    // 이름 부분을 통째로 놓치는 경우가 있는데(실측 확인: 같은 스크린샷이라도 전체를 한 번에 읽을 때는
    // 특정 행이 깨졌다가, 그 행만 격리해서 다시 읽으면 정상 인식되는 사례 있음 — Tesseract의 문맥 의존적
    // 레이아웃 분석 오류로 추정), 행을 격리해서 재시도하면 이런 오류를 피할 수 있다. 아이콘 상관관계
    // 폴백보다 먼저 시도한다 — 텍스트 재인식 성공이 아이콘 유사도 추정보다 신뢰도가 높기 때문.
    async function enhanceUnmatchedRowsWithTargetedOcr(panel, fuzzyMatchPool) {
      if (!pendingCombatAnalysisCanvas) return;
      const rowsWithBbox = [...panel.querySelectorAll('.combatAnalysisRow')].filter((row) => row.classList.contains('unmatched') && row._bbox);
      if (rowsWithBbox.length === 0) return;

      const worker = await Tesseract.createWorker('kor');
      await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE });
      try {
        for (const row of rowsWithBbox) {
          const bbox = row._bbox;
          const text = await ocrSingleLineCrop(worker, pendingCombatAnalysisCanvas, bbox.y0 - 3, bbox.y1 + 3);
          const matched = text ? fuzzyMatchSkillName(text, fuzzyMatchPool) : null;
          if (matched) {
            row.classList.remove('unmatched');
            row.querySelector('.combatAnalysisSkillSelect').value = matched;
            row.querySelector('.rawText').textContent = `OCR: ${text} (재시도 인식: ${matched})`;
          }
        }
      } finally {
        await worker.terminate();
      }
    }

    // 행 자체가 통째로 안 잡히는 경우(위 함수는 "매칭 실패"만 다루는데, 이건 애초에 목록에 행이 없는
    // 경우라 다름) 대응: 표의 행들은 일정한 간격으로 배치돼 있으므로, 정상 인식된 행들 사이의 y좌표 간격
    // (행 높이)을 기준값으로 삼아, 그 기준값의 약 1.6배 이상 벌어진 구간을 "행이 통째로 빠졌다"는 신호로
    // 보고 예상 위치를 계산해서 그 구간만 targeted OCR로 복구를 시도한다. 표 맨 처음/맨 끝에서 통째로
    // 빠진 행은(양옆에 기준으로 삼을 행이 없어서) 이 방식으로 못 잡는 한계가 있음.
    async function recoverMissingRowsFromSpacing(fuzzyMatchPool) {
      if (!pendingCombatAnalysisCanvas) return [];
      const sorted = pendingCombatAnalysisRows.filter((r) => r.bbox).sort((a, b) => a.bbox.y0 - b.bbox.y0);
      if (sorted.length < 3) return [];

      const gaps = [];
      for (let i = 1; i < sorted.length; i++) gaps.push(sorted[i].bbox.y0 - sorted[i - 1].bbox.y0);
      const sortedGaps = [...gaps].sort((a, b) => a - b);
      const typicalGap = sortedGaps[Math.floor(sortedGaps.length / 2)];
      if (!typicalGap || typicalGap <= 0) return [];

      const worker = await Tesseract.createWorker('kor');
      await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE });
      const recovered = [];
      try {
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].bbox.y0 - sorted[i - 1].bbox.y0;
          const missingCount = Math.round(gap / typicalGap) - 1;
          if (missingCount <= 0) continue;
          const rowHeight = sorted[i - 1].bbox.y1 - sorted[i - 1].bbox.y0;
          for (let k = 1; k <= missingCount; k++) {
            const y0 = Math.round(sorted[i - 1].bbox.y0 + (gap * k) / (missingCount + 1));
            const y1 = y0 + rowHeight;
            const text = await ocrSingleLineCrop(worker, pendingCombatAnalysisCanvas, y0 - 3, y1 + 3);
            const parsed = text ? parseCombatAnalysisLine(text) : null;
            if (!parsed) continue;
            recovered.push({ rawName: parsed.rawName, sharePercent: parsed.sharePercent, bbox: { x0: 0, y0, y1 } });
          }
        }
      } finally {
        await worker.terminate();
      }
      return recovered;
    }

    // 이름 OCR이 완전히 깨져서(fuzzyMatchSkillName 실패) 매칭 안 된 행들에 대해, 그 행의 아이콘 영역을
    // 실제 캐릭터 스킬 아이콘들과 비교해서 가장 비슷한 스킬을 드롭다운 기본값으로 대신 채워준다. 어디까지나
    // "추정값 미리 채우기"라 여전히 빨간 테두리(확인 필요) 상태는 유지 — 사용자가 최종 확인해야 함.
    async function enhanceUnmatchedRowsWithIconMatch(panel, dealerData) {
      if (!pendingCombatAnalysisCanvas) return;
      const rowsWithBbox = [...panel.querySelectorAll('.combatAnalysisRow')].filter((row) => row.classList.contains('unmatched') && row._bbox);
      if (rowsWithBbox.length === 0) return;

      const candidates = (dealerData.combatSkills || []).filter((s) => s.Icon);
      if (candidates.length === 0) return;

      const candidateVectors = await Promise.all(candidates.map(async (s) => {
        try {
          const img = await loadImageCors(s.Icon);
          return { name: s.Name, vector: regionToGrayscalePixels(img, 0, 0, img.width, img.height, ICON_COMPARE_SIZE) };
        } catch (e) {
          return null;
        }
      }));
      const validCandidates = candidateVectors.filter(Boolean);
      if (validCandidates.length === 0) return;

      rowsWithBbox.forEach((row) => {
        const bbox = row._bbox;
        const h = bbox.y1 - bbox.y0;
        if (h <= 0) return;
        const rowVector = regionToGrayscalePixels(pendingCombatAnalysisCanvas, pendingCombatAnalysisIconX, bbox.y0, h, h, ICON_COMPARE_SIZE);
        let best = null;
        let bestScore = -Infinity;
        validCandidates.forEach((c) => {
          const score = compareGrayscalePixelArrays(rowVector, c.vector);
          if (score > bestScore) { bestScore = score; best = c.name; }
        });
        // 0.1은 너무 느슨해서(calculate.js의 compareGrayscalePixelArrays 실측 기준: 올바른 쌍 0.87 vs
        // 틀린 쌍 -0.001) 약한 상관관계인데도 확신 있는 것처럼 잘못된 스킬로 자동 채워버리는 사례가 있었음
        // (예: "샤프 슈터" 행이 "그림자 화살"로 잘못 추정). 정답/오답 점수 차이가 크므로 중간값 정도로 올려서,
        // 확신 없는 경우엔 차라리 미매칭(빨간 테두리)으로 남겨 사용자가 직접 고르게 한다.
        if (best && bestScore > 0.5) {
          row.querySelector('.combatAnalysisSkillSelect').value = best;
          const rawTextEl = row.querySelector('.rawText');
          if (!rawTextEl.textContent.includes('(아이콘 추정')) {
            rawTextEl.textContent += ` (아이콘 추정: ${best})`;
          }
        }
      });
    }

    // 전투분석 사진 등록 탭: OCR로 뽑은 스킬명/지분%를 실제 캐릭터 스킬 목록과 매칭한 편집 가능한 표로
    // 보여주고, "재계산"을 누르면 calculateCombatAnalysisWeightedCrit로 지분 가중 평균피해배율을 계산해서
    // 기본(스킬 영향 없음) 배율과 비교한다. 치명타 피해/적중률은 뭉툭한 가시 전환·합연산 특성 때문에
    // 스킬(트라이포드)마다 실제 기여도가 달라서(적주피%는 곱연산이라 스킬별로 안 갈라도 됨, 그래서 이건
    // 치명타 배율만 대상), 지분 가중 평균값을 ctx.critResult.avgDamageMultiplier에 직접 반영해 "현재 정보"
    // 탭의 최종 산출식/풀버프 최종 산출식(recomputeDealerLiveNumbers)에도 실제로 반영되도록 한다.
    function renderDealerAnalysisTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="analysis"]');
      const skillNames = (ctx.dealerData.combatSkills || []).map((s) => s.Name);
      // 초각성기/초각성 스킬/아이덴티티는 combat-skills API에 없어서 skillNames만으론 이름 매칭이 안 됨 —
      // 직업별 정적 테이블(calculate.js)에서 후보를 가져와 매칭 풀에 추가(이미 API에 있는 이름과 겹치면 제외).
      const hyperIdentityNames = getClassHyperAwakeningIdentitySkillNames(ctx.dealerStats.className)
        .filter((name) => !skillNames.includes(name));
      const fuzzyMatchPool = skillNames.concat(hyperIdentityNames);

      panel.innerHTML = `
        <div class="fieldGroup">
          <h4>전투분석 사진 등록${pendingCombatAnalysisRows.length ? ' — OCR 인식 결과 (확인/수정 후 재계산)' : ''}</h4>
          <p style="font-size:12px;color:#888;">
            ${pendingCombatAnalysisRows.length
              ? '이름이 자동으로 안 맞혀진 행은 빨간 테두리로 표시됩니다 — 스킬 아이콘으로 자동 추정해 채워보지만("아이콘 추정" 표시), 정확하지 않을 수 있으니 꼭 눈으로 확인/수정해주세요.'
              : '조회 화면에서 전투분석 사진을 등록하지 않았습니다. 아래에서 직접 스킬/지분을 입력할 수도 있습니다.'}
            지분 2% 미만이거나 "선택 안 함"인 스킬/트라이포드는 조건 없이(상시 계산 기준) 처리됩니다.
            "재계산"을 누르면 여기서 나온 지분 가중 평균피해배율이 "현재 정보" 탭의 최종 산출식에도 그대로 반영됩니다.
          </p>
          <div class="combatAnalysisRows"></div>
          <button type="button" class="combatAnalysisAddRow">+ 행 추가</button>
          <button type="button" class="combatAnalysisRecalc">재계산</button>
          <div class="combatAnalysisResult"></div>
        </div>
      `;

      const rowsContainer = panel.querySelector('.combatAnalysisRows');

      function addRow(rawName, sharePercent, bbox) {
        // bbox가 있으면 OCR에서 뽑아낸 행(이름 인식에 완전히 실패해서 rawName이 빈 문자열이어도 여전히
        // 사용자 확인이 필요) — bbox가 없으면 "+ 행 추가"로 사용자가 직접 만든 빈 행(처음부터 비어있는 게
        // 정상이라 굳이 빨간 테두리로 경고할 필요 없음). 예전엔 rawName이 빈 문자열이면(완전히 못 읽은 경우)
        // "" && ... 가 falsy라서 경고 표시 자체가 안 되는 버그가 있었음.
        const isFromOcr = bbox !== undefined && bbox !== null;
        const matched = rawName ? fuzzyMatchSkillName(rawName, fuzzyMatchPool) : null;
        const row = document.createElement('div');
        row.className = 'combatAnalysisRow' + (isFromOcr && !matched ? ' unmatched' : '');
        row._bbox = bbox || null;
        const options = ['<option value="">-- 선택 안 함(조건없음) --</option>']
          .concat(skillNames.map((name) => `<option value="${name}" ${name === matched ? 'selected' : ''}>${name}</option>`))
          .concat(hyperIdentityNames.length
            ? [`<optgroup label="초각성/아이덴티티 (트라이포드 보너스 미반영)">${hyperIdentityNames.map((name) => `<option value="${name}" ${name === matched ? 'selected' : ''}>${name}</option>`).join('')}</optgroup>`]
            : [])
          .join('');
        row.innerHTML = `
          <span class="rawText">${rawName ? 'OCR: ' + rawName : '(직접 입력)'}</span>
          <select class="combatAnalysisSkillSelect">${options}</select>
          <input type="number" class="combatAnalysisShareInput" min="0" max="100" step="0.01" value="${sharePercent === undefined || sharePercent === '' ? '' : sharePercent}" placeholder="지분%">
          <button type="button" class="combatAnalysisRemoveRow">✕</button>
        `;
        row.querySelector('.combatAnalysisRemoveRow').addEventListener('click', () => row.remove());
        rowsContainer.appendChild(row);
      }

      pendingCombatAnalysisRows.forEach((r) => addRow(r.rawName, r.sharePercent, r.bbox));
      panel.querySelector('.combatAnalysisAddRow').addEventListener('click', () => addRow('', ''));
      // 1) 행 간격으로 통째로 빠진 행 복구 → 2) 매칭 실패 행 격리 재인식 → 3) (그래도 안 되면) 아이콘
      // 교차 검증. 전부 비동기 — 완료되면 드롭다운이 채워진 새 상태로 자동 재계산.
      recoverMissingRowsFromSpacing(fuzzyMatchPool)
        .then((recovered) => recovered.forEach((r) => addRow(r.rawName, r.sharePercent, r.bbox)))
        .then(() => enhanceUnmatchedRowsWithTargetedOcr(panel, fuzzyMatchPool))
        .then(() => enhanceUnmatchedRowsWithIconMatch(panel, ctx.dealerData))
        .then(() => recalc());

      function recalc() {
        const skillShares = [];
        rowsContainer.querySelectorAll('.combatAnalysisRow').forEach((row) => {
          const name = row.querySelector('.combatAnalysisSkillSelect').value;
          const sharePercent = parseFloat(row.querySelector('.combatAnalysisShareInput').value) || 0;
          skillShares.push({ name, sharePercent });
        });
        const result = calculateCombatAnalysisWeightedCrit(ctx.dealerData, ctx.supportData, { partyClassNames: ctx.partyClassNames }, skillShares);
        const rowsHtml = result.skillRows.map((r) => `
          <tr>
            <td>${r.name || '(선택 안 함)'}</td>
            <td>${r.sharePercent.toFixed(2)}%</td>
            <td>${r.matched ? '✓' : '-'}</td>
            <td>${r.critRateBonus}%</td>
            <td>${r.critDamageBonus}%</td>
            <td>${r.avgDamageMultiplier.toFixed(4)}</td>
          </tr>
        `).join('');
        panel.querySelector('.combatAnalysisResult').innerHTML = `
          <table class="statTable">
            <tr><th>스킬</th><th>지분</th><th>매칭</th><th>치적 보너스</th><th>치피 보너스</th><th>평균피해배율</th></tr>
            ${rowsHtml}
          </table>
          <table class="statTable">
            <tr><th>기본(스킬 영향 없음) 평균피해배율</th><td>${result.baseAvgDamageMultiplier.toFixed(4)}</td></tr>
            <tr><th>지분 가중 평균피해배율</th><td>${result.weightedAvgDamageMultiplier.toFixed(4)}</td></tr>
            <tr><th>변화율</th><td>${(((result.weightedAvgDamageMultiplier / result.baseAvgDamageMultiplier) - 1) * 100).toFixed(2)}%</td></tr>
          </table>
        `;

        // 지분 가중 평균피해배율을 최종 산출식에 실제로 반영(더 이상 실험용 표시 전용이 아님) — 지분
        // 데이터가 없으면 calculateCombatAnalysisWeightedCrit가 자동으로 기본 배율과 동일한 값을 반환하므로
        // 별도 분기 없이 항상 덮어써도 안전하다. "현재 정보" 탭의 최종 산출식/풀버프 최종 산출식 실시간
        // 표시(recomputeDealerLiveNumbers, 아드/암수 체크박스와 동일 갱신 경로)에 그대로 반영됨.
        ctx.critResult.avgDamageMultiplier = result.weightedAvgDamageMultiplier;
        recomputeDealerLiveNumbers(ctx);

        // 진화 트리 최적화(특히 뭉툭한 가시 판단)도 같은 스킬 지분으로 다시 계산 — 뭉툭한 가시는 스킬
        // 트라이포드의 치명타 적중률 보너스에 따라 유불리가 갈리기 때문에 지분 가중이 중요하다.
        renderEvolutionOptimizationSection(ctx, skillShares);
      }

      panel.querySelector('.combatAnalysisRecalc').addEventListener('click', recalc);
      if (pendingCombatAnalysisRows.length > 0) recalc();
    }

    // 아크그리드 탭 — 왼쪽은 실제(API) 현재 상태, 오른쪽은 시뮬레이터(최적화 없이 입력값으로 즉시 재계산).
    // 질서 코어는 17P부터 1P당 적주피 0.15%로 환산되는 단순화 규칙(16P 미만은 0%), 혼돈 코어는 실제 장착된
    // 코어의 [XXP] 구간(18/19/20P 등) 옵션을 그대로 사용, 젬 3항목(공격력/추가피해/보스피해)은 직접 입력한
    // %로 대체해서 계산한다(calculateArkGridPointGemSimulation). 보석(gem) 자체 시뮬레이터는 별도 탭 예정.
    function renderDealerArkGridTab(ctx) {
      const panel = views.dealer.querySelector('.tabPanel[data-panel="arkgrid"]');
      const corePoints = getArkgridCorePointsByGroup(ctx.dealerData.arkgrid);
      const coreSummary = getArkgridCoreSummary(ctx.dealerData.arkgrid);
      const realGemAttack = ctx.dealerStats.arkgridGemsAttackPercent || 0;
      const realGemExtra = ctx.extraDamageResult.extraDamageBreakdown.아크그리드젬 || 0;
      const realGemBoss = ctx.enemyDamageResult.breakdown.아크그리드젬_보스피해 || 0;
      const coreRows = coreSummary.map((c) => `<tr><td>${c.name}</td><td>${c.point}P</td><td>${c.grade}</td></tr>`).join('');

      panel.innerHTML = `
        <div class="fieldGroup">
          <h4>아크그리드 시뮬레이터</h4>
          <p style="font-size:11px;color:#888;">
            최적화가 아닌 직접 입력 계산기입니다. 질서 코어는 17P부터 1P당 적에게 주는 피해 0.15%로 환산되고(16P 미만은 0%),
            혼돈 코어는 실제 장착된 코어의 18/19/20P 등 구간 옵션을 그대로 사용합니다. 젬 공격력/추가피해/보스피해는
            입력한 값이 실제 장착된 젬 값을 대체해서 계산됩니다. 모든 입력칸은 현재 실제 상태로 기본 채워져 있습니다.
          </p>
          <div class="braceletColumns">
            <div>
              <h5>현재 상태</h5>
              <table class="statTable">
                <tr><th>코어</th><th>포인트</th><th>등급</th></tr>
                ${coreRows}
              </table>
              <table class="statTable">
                <tr><th>젬 공격력</th><td>${pct(realGemAttack)}%</td></tr>
                <tr><th>젬 추가피해</th><td>${pct(realGemExtra)}%</td></tr>
                <tr><th>젬 보스피해</th><td>${pct(realGemBoss)}%</td></tr>
              </table>
            </div>
            <div>
              <h5>시뮬레이터</h5>
              <div class="gemSimGrid">
                <div class="gemSimGroup">
                  <h5>질서 코어 (포인트)</h5>
                  <label>해 <input type="number" class="gemSimInput" id="gemSimOrder해" min="0" max="20" step="1" value="${corePoints.질서.해}"></label>
                  <label>달 <input type="number" class="gemSimInput" id="gemSimOrder달" min="0" max="20" step="1" value="${corePoints.질서.달}"></label>
                  <label>별 <input type="number" class="gemSimInput" id="gemSimOrder별" min="0" max="20" step="1" value="${corePoints.질서.별}"></label>
                </div>
                <div class="gemSimGroup">
                  <h5>혼돈 코어 (포인트)</h5>
                  <label>해 <input type="number" class="gemSimInput" id="gemSimChaos해" min="0" max="20" step="1" value="${corePoints.혼돈.해}"></label>
                  <label>달 <input type="number" class="gemSimInput" id="gemSimChaos달" min="0" max="20" step="1" value="${corePoints.혼돈.달}"></label>
                  <label>별 <input type="number" class="gemSimInput" id="gemSimChaos별" min="0" max="20" step="1" value="${corePoints.혼돈.별}"></label>
                </div>
                <div class="gemSimGroup">
                  <h5>젬 (직접 입력 %)</h5>
                  <label>공격력 <input type="number" class="gemSimInput" id="gemSimAttack" step="0.01" value="${realGemAttack}"></label>
                  <label>추가피해 <input type="number" class="gemSimInput" id="gemSimExtra" step="0.01" value="${realGemExtra}"></label>
                  <label>보스피해 <input type="number" class="gemSimInput" id="gemSimBoss" step="0.01" value="${realGemBoss}"></label>
                </div>
              </div>
              <div class="gemSimResult"></div>
            </div>
          </div>
        </div>
      `;

      function recalcGemSim() {
        const val = (id) => parseFloat(document.getElementById(id).value) || 0;
        const inputs = {
          orderPoints: { 해: val('gemSimOrder해'), 달: val('gemSimOrder달'), 별: val('gemSimOrder별') },
          chaosPoints: { 해: val('gemSimChaos해'), 달: val('gemSimChaos달'), 별: val('gemSimChaos별') },
          gemAttackPercent: val('gemSimAttack'),
          gemExtraDamagePercent: val('gemSimExtra'),
          gemBossDamagePercent: val('gemSimBoss'),
        };
        const result = calculateArkGridPointGemSimulation(ctx, inputs);
        panel.querySelector('.gemSimResult').innerHTML = `
          <table class="statTable">
            <tr><th>질서 코어 적주피 배율</th><td>${result.orderMultiplier.toFixed(4)} (해 ${pct(result.orderPercents.해)}% · 달 ${pct(result.orderPercents.달)}% · 별 ${pct(result.orderPercents.별)}%)</td></tr>
            <tr><th>혼돈 코어 적주피 배율</th><td>${result.chaosMultiplier.toFixed(4)} (해 ${pct(result.chaosPercents.해)}% · 달 ${pct(result.chaosPercents.달)}% · 별 ${pct(result.chaosPercents.별)}%)</td></tr>
            <tr><th>공격력(최종)</th><td>${Math.round(result.finalDamage).toLocaleString()}</td></tr>
            <tr><th>추가피해 배율</th><td>${result.extraDamageMultiplier.toFixed(4)}</td></tr>
            <tr><th>적에게 주는 피해 배율</th><td>${result.enemyDamageMultiplier.toFixed(4)}</td></tr>
            <tr><th>실제(현재) 대비 변화율</th><td>${pct(result.totalChangePercent)}%</td></tr>
          </table>
        `;
      }

      panel.querySelectorAll('.gemSimInput').forEach((input) => {
        input.addEventListener('input', recalcGemSim);
      });
      recalcGemSim();
    }

    function renderDealerView(ctx) {
      const info = buildDealerCurrentInfo(ctx.dealerData, ctx.dealerStats, ctx);
      renderDealerInfoTab(ctx, info);
      renderDealerEquipTab(ctx);
      renderDealerBraceletTab(ctx, info);
      renderDealerAbilityStoneTab(ctx);
      renderDealerEvolutionTab(ctx);
      renderDealerAnalysisTab(ctx);
      renderDealerArkGridTab(ctx);
    }

    function renderSupportView(ctx) {
      views.support.querySelector('.viewBody').innerHTML = `
        <h3>${ctx.supportLabel} (${ctx.supportStats.className})</h3>
        ${buildSupportStatsHtml(ctx)}
      `;
    }

    function renderDuoView(ctx) {
      views.duo.querySelector('.viewBody').innerHTML = `
        <h3>딜러: ${ctx.dealerLabel} (${ctx.dealerStats.className})</h3>
        ${buildDealerStatsHtml(ctx)}
        <h3>서포터: ${ctx.supportLabel} (${ctx.supportStats.className})</h3>
        ${buildSupportStatsHtml(ctx)}
        <h3 class="finalOutput">최종 공격력: ${ctx.finalDamage.toLocaleString()}</h3>
        <h3 class="finalOutput">최종 산출식: ${ctx.finalOutputResult.output.toLocaleString()}</h3>
        <h3 class="finalOutput">풀버프 최종 산출식: ${ctx.fullBuffFinalOutputResult.output.toLocaleString()}</h3>
      `;
    }

    const renderers = { dealer: renderDealerView, support: renderSupportView, duo: renderDuoView };

    function showView(mode) {
      searchScreen.style.display = 'none';
      Object.values(views).forEach((view) => { view.style.display = 'none'; });
      views[mode].style.display = '';
    }

    function backToSearch() {
      Object.values(views).forEach((view) => { view.style.display = 'none'; });
      searchScreen.style.display = '';
    }

    document.querySelectorAll('.backBtn').forEach((btn) => {
      btn.addEventListener('click', backToSearch);
    });

    searchBtn.addEventListener('click', async () => {
      const dealerNameRaw = dealerNameInput.value.trim();
      const supportNameRaw = supportNameInput.value.trim();

      if (!dealerNameRaw && !supportNameRaw) {
        searchMessage.textContent = '한개 이상의 닉네임을 입력하세요';
        return;
      }

      const dealerIsDefault = !dealerNameRaw;
      const supportIsDefault = !supportNameRaw;
      const dealerName = dealerNameRaw || DEFAULT_DEALER_NAME;
      const supportName = supportNameRaw || DEFAULT_SUPPORT_NAME;
      const simMode = document.querySelector('input[name="simMode"]:checked').value;

      searchMessage.textContent = '조회 중...';

      try {
        const response = await fetch(`/api/character?dealer=${encodeURIComponent(dealerName)}&support=${encodeURIComponent(supportName)}`);
        const data = await response.json();

        if (!response.ok) {
          searchMessage.textContent = data.error || '조회에 실패했습니다.';
          return;
        }

        searchMessage.textContent = '';

        const dealerStats = calculateCharacterStats(data.dealer);
        const supportStats = calculateCharacterStats(data.support);

        if (!dealerStats || !supportStats) {
          searchMessage.textContent = '무기 정보를 찾을 수 없습니다.';
          return;
        }

        const dealerLabel = dealerIsDefault ? '' : dealerStats.characterName;
        const supportLabel = supportIsDefault ? '' : supportStats.characterName;

        const partyClassNames = [synergyClass2Select.value, synergyClass3Select.value].filter(Boolean);
        const fullPartyClassNames = [dealerStats.className, ...partyClassNames];

        const effectiveRatio = readRatio(effectiveRatioInput, supportStats.className, '공증');
        const brandEffectiveRatio = readRatio(brandEffectiveRatioInput, supportStats.className, '낙인');
        const effectiveRatio1 = readRatio(effectiveRatio1Input, supportStats.className, '피증1');
        const effectiveRatio2 = readRatio(effectiveRatio2Input, supportStats.className, '피증2');

        const allyBuffPercent = getTotalAllyAttackBuffPercent(data.support.equipment, supportStats.braceletOptions, data.support.arkgrid);
        const buffGemPercent = getSupportBuffGemPercent(data.support.gems, supportStats.className);
        const supportBuffPower = calculateSupportBuffPower(supportStats.basePower, allyBuffPercent, buffGemPercent, effectiveRatio);

        const adrenalineStoneBonus = getAdrenalineStoneBonus(data.dealer.equipment);
        const adrenalineBonusBase = (hasAdrenalineEngraving(data.dealer.engravings) ? 9 : 0) + adrenalineStoneBonus;
        const classSynergyAttackPercent = sumPartySynergyPercent(fullPartyClassNames, SYNERGY_ATTACK_POWER_CLASSES, SYNERGY_ATTACK_POWER_PERCENT);
        const arkPassiveAttackPercent = getArkPassivePersistentAttackPercent(data.dealer.arkpassive);

        const finalDamage = calculateFinalDamage(
          dealerStats.basePower, dealerStats.accessoryAttackFlat, dealerStats.chaosCoreAttack.flat, supportBuffPower,
          dealerStats.chaosCoreAttack.percent, dealerStats.earringAttackPercent, dealerStats.arkgridGemsAttackPercent,
          adrenalineBonusBase, classSynergyAttackPercent, arkPassiveAttackPercent
        );

        const critResult = calculateCritMultiplier(data.dealer, data.support, { partyClassNames });
        const extraDamageResult = calculateExtraDamageMultiplier(data.dealer);
        const enemyDamageResult = calculateEnemyDamageMultiplier(data.dealer, critResult.critRatePercent, data.support, brandEffectiveRatio, { partyClassNames });
        const brandResult = calculateBrandMultiplier(data.support, { brandEffectiveRatio });
        const adenkiDamageBuffResult = calculateSupportAdenkiDamageBuffMultiplier(data.support, supportStats.className, { effectiveRatio1 });
        const hyperAwakeningDamageBuffResult = calculateSupportHyperAwakeningDamageBuffMultiplier(data.support, supportStats.className, { effectiveRatio2 });
        const cardExtraDamageResult = calculateCardExtraDamageMultiplier();
        const classSynergyDefenseReductionPercent = sumPartySynergyPercent(fullPartyClassNames, SYNERGY_DEFENSE_REDUCTION_CLASSES, SYNERGY_DEFENSE_REDUCTION_PERCENT);
        const defenseResult = calculateDefenseMultiplier({ synergyAPercent: classSynergyDefenseReductionPercent });

        const finalOutputResult = calculateFinalOutput(
          finalDamage, critResult.avgDamageMultiplier, extraDamageResult.multiplier, enemyDamageResult.multiplier,
          defenseResult.multiplier, brandResult.multiplier, cardExtraDamageResult.multiplier
        );
        const fullBuffFinalOutputResult = calculateFullBuffFinalOutput(
          finalOutputResult.output, adenkiDamageBuffResult.multiplier, hyperAwakeningDamageBuffResult.multiplier
        );

        const ctx = {
          dealerData: data.dealer, supportData: data.support,
          dealerStats, supportStats, dealerLabel, supportLabel,
          partyClassNames, brandEffectiveRatio,
          allyBuffPercent, buffGemPercent, supportBuffPower,
          adrenalineBonusBase, classSynergyAttackPercent, classSynergyDefenseReductionPercent, arkPassiveAttackPercent,
          finalDamage, critResult, extraDamageResult, enemyDamageResult, brandResult,
          adenkiDamageBuffResult, hyperAwakeningDamageBuffResult, cardExtraDamageResult,
          defenseResult, finalOutputResult, fullBuffFinalOutputResult,
          baselineFullBuffOutput: fullBuffFinalOutputResult.output,
        };

        renderers[simMode](ctx);
        showView(simMode);
      } catch (error) {
        searchMessage.textContent = '오류가 발생했습니다: ' + error.message;
      }
    });
  </script>
</body>
</html>
